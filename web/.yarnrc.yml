# Yarn 4, same as the loader package. The cache is not committed: a
# committed cache in a public repository is megabytes of other people's code
# in every clone.
nodeLinker: node-modules
enableGlobalCache: true

# esbuild and the SWC binding fetch a platform binary in a postinstall
# script, and Berry disables build scripts unless a package is named. Named
# here rather than by turning scripts on globally: the list is the point —
# it says which dependencies are allowed to run code at install time, and it
# is reviewable in a diff.
enableScripts: true
supportedArchitectures:
  os: ["linux", "darwin"]
  cpu: ["x64", "arm64"]
