# The JDK that COMPILES is declared in build.gradle.kts as a toolchain, and
# auto-download is off so Gradle uses the one the environment manifest
# installed rather than fetching a second one behind its back.
#
# That split is worth knowing: the JVM Gradle itself runs on is not the JVM
# it compiles for, and Gradle ships with its own. Without the toolchain
# declaration the target is whatever the daemon happens to be, which is a
# reproducible build by coincidence.
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=true

# The daemon is a background process that outlives the build. In CI that is
# a process nobody stops, holding a lock on a cache that the next job
# expects to be free.
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
