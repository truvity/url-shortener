{{/*
The migration, as a hook that runs BEFORE the components that read the
schema, and again before every upgrade.

`before-hook-creation` as the delete policy, not `hook-succeeded`: a Job that
deletes itself on success leaves nothing to read when the NEXT one fails, and
"what did the last successful migration do" is a question people ask during
an incident.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "url-shortener.name" . }}-migrate
  labels: {{- include "url-shortener.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {{- include "url-shortener.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "url-shortener.migrateServiceAccountName" . }}
      {{- include "url-shortener.podSecurity" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "url-shortener.image" (dict "Values" .Values "root" $ "component" "migrate") }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          {{- include "url-shortener.containerSecurity" . | nindent 10 }}
          args: ["-config", "/etc/url-shortener/migrate.yaml"]
          env:
            {{- include "url-shortener.telemetryEnv" (dict "root" $ "component" "migrate") | nindent 12 }}
            {{- include "url-shortener.dbEnv" (dict "root" $ "role" .Values.database.owner "component" "migrate") | nindent 12 }}
            {{- /* DDL can outlast the services' 30 s default, and a
            migration that is cut off half way is worse than one that is
            slow. */}}
            - name: CNPG_CLIENT_STATEMENT_TIMEOUT
              value: "10m"
          volumeMounts:
            {{- include "url-shortener.dbCAMount" . | nindent 12 }}
            {{- include "url-shortener.dbPasswordMount" . | nindent 12 }}
            - name: config
              mountPath: /etc/url-shortener
              readOnly: true
          resources: {{- toYaml .Values.resources.migrate | nindent 12 }}
      volumes:
        {{- include "url-shortener.dbCAVolume" . | nindent 8 }}
        {{- include "url-shortener.dbPasswordVolume" .Values.database.owner | nindent 8 }}
        - name: config
          configMap:
            name: {{ include "url-shortener.name" . }}-migrate-config
