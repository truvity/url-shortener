{{- /*
One ConfigMap per binary, holding exactly the file that binary validates
against its own schema at start-up.

This is the configuration contract's first rule made real: the chart and the
binary read ONE schema, so a key this chart renders that the binary does not
know is a test failure here rather than a default nobody chose in a cluster.
The test that proves it is chart_test.go, which pulls these files out of a
render and validates them with the binary's schema.

The migration's file is NOT here — it is in migrate.yaml, as part of the
hook. See that file for why.

No secret appears in any of them. The database password is NAMED — the
component reads the variable the file points at.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "url-shortener.name" . }}-config
  labels: {{- include "url-shortener.labels" . | nindent 4 }}
data:
  redirect.yaml: |
    listen:
      address: ":8080"
    probes:
      address: ":7070"
    log:
      level: {{ .Values.log.level }}
    drain:
      seconds: {{ .Values.drain.seconds }}
    {{- if include "url-shortener.tlsOn" . }}
    tls:
      mode: {{ .Values.tls.mode }}
      {{- if eq .Values.tls.mode "permissive" }}
      address: ":{{ .Values.tls.port }}"
      {{- end }}
      certFile: {{ .Values.tls.mountPath }}/tls.crt
      keyFile: {{ .Values.tls.mountPath }}/tls.key
      caFile: {{ .Values.tls.mountPath }}/ca.crt
      trustDomain: {{ required "tls.trustDomain is required once tls.mode is not off: without it a peer from any trust domain is admitted" .Values.tls.trustDomain }}
      {{- /*
      toYaml, so that an EMPTY list renders as `[]` rather than as a key with
      nothing under it. The second is YAML null, the service refuses it at
      start-up ("tls.peers: got null, want array"), and the pod crash-loops —
      and the state that triggers it is the DEFAULT, because an empty
      allow-list is what a service nobody has been granted looks like. The
      values schema pins each entry to exactly the two keys below, so nothing
      unexpected can be passed through here.
      */}}
      peers:{{ toYaml (.Values.tls.peers.redirect | default list) | nindent 8 }}
    {{- end }}
    database:
      url: {{ include "url-shortener.databaseURL" . }}
      {{- if ne .Values.database.app.auth "certificate" }}
      passwordEnv: DATABASE_PASSWORD
      {{- end }}
      maxConnections: 10
    events:
      nats:
        url: {{ .Values.events.url }}
        {{- with .Values.events.auth.audience }}
        {{- /* The broker authenticates its clients; the token is
        a projected ServiceAccount token this pod cannot forge. */}}
        tokenFile: /var/run/events/token
        {{- end }}
      redirectSubject: {{ .Values.events.redirectSubject }}
      requestSubject: {{ .Values.events.requestSubject }}

  urls.yaml: |
    listen:
      address: ":8080"
    probes:
      address: ":7070"
    log:
      level: {{ .Values.log.level }}
    drain:
      seconds: {{ .Values.drain.seconds }}
    {{- if include "url-shortener.tlsOn" . }}
    tls:
      mode: {{ .Values.tls.mode }}
      {{- if eq .Values.tls.mode "permissive" }}
      address: ":{{ .Values.tls.port }}"
      {{- end }}
      certFile: {{ .Values.tls.mountPath }}/tls.crt
      keyFile: {{ .Values.tls.mountPath }}/tls.key
      caFile: {{ .Values.tls.mountPath }}/ca.crt
      trustDomain: {{ required "tls.trustDomain is required once tls.mode is not off: without it a peer from any trust domain is admitted" .Values.tls.trustDomain }}
      {{- /*
      toYaml, so that an EMPTY list renders as `[]` rather than as a key with
      nothing under it. The second is YAML null, the service refuses it at
      start-up ("tls.peers: got null, want array"), and the pod crash-loops —
      and the state that triggers it is the DEFAULT, because an empty
      allow-list is what a service nobody has been granted looks like. The
      values schema pins each entry to exactly the two keys below, so nothing
      unexpected can be passed through here.
      */}}
      {{- /*
      This release's OWN counter, and then whoever the operator added.

      The chart knows its internal callers — it is the thing that wired the
      counter to this service — so it grants them, and `tls.peers.urls` is
      for callers OUTSIDE the release. Leaving the internal one to the
      operator would mean a chart whose default configuration cannot talk to
      itself: every install of `strict` comes up with the counter refused at
      the handshake, and the error names a certificate rather than a list
      nobody filled in. Measured on a cluster, not imagined.
      */}}
      peers:
        - namespace: {{ .Release.Namespace }}
          serviceAccount: {{ include "url-shortener.appServiceAccountName" . }}
        {{- with .Values.tls.peers.urls }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    {{- end }}
    database:
      url: {{ include "url-shortener.databaseURL" . }}
      {{- if ne .Values.database.app.auth "certificate" }}
      passwordEnv: DATABASE_PASSWORD
      {{- end }}
      maxConnections: 20

  stat.yaml: |
    probes:
      address: ":7070"
    log:
      level: {{ .Values.log.level }}
    drain:
      seconds: {{ .Values.drain.seconds }}
    {{- if include "url-shortener.tlsOn" . }}
    tls:
      {{- /*
      `strict` whenever the transport is on at all, including while the rest
      of the release is `permissive` — and that is not a copy-paste slip.

      The counter SERVES nothing. For a component that only calls out there
      is no third state: it either presents an identity or it does not, and
      `permissive` is meaningless because there is no second listener to put
      anywhere. Rendering it here produced a crash loop with an error about
      a listener address on a component that has none.

      `permissive` exists so an edge can migrate one CALLER at a time. This
      chart wires both ends of this call, so there is no caller to wait for.
      */}}
      mode: strict
      certFile: {{ .Values.tls.mountPath }}/tls.crt
      keyFile: {{ .Values.tls.mountPath }}/tls.key
      caFile: {{ .Values.tls.mountPath }}/ca.crt
      trustDomain: {{ required "tls.trustDomain is required once tls.mode is not off: without it a peer from any trust domain is admitted" .Values.tls.trustDomain }}
      {{- /*
      Who this component will ACCEPT AN ANSWER FROM — which is NOT the same
      question as who may call the URL service, and must not share a list
      with it. One is "may this caller in", the other is "is the thing that
      answered the service I meant to reach"; a client that checked only the
      certificate chain would accept any workload in the trust domain that
      happened to answer on that address.

      It is the account the URL service runs as. In this chart every
      component shares one application account, so that is this release's;
      a deployment that gave each component its own would name the URL
      service's here, and the two lists would stop looking alike.
      */}}
      peers:
        - namespace: {{ .Release.Namespace }}
          serviceAccount: {{ include "url-shortener.appServiceAccountName" . }}
    {{- end }}
    urls:
      {{- /*
      Which PORT depends on the URL service's mode, because that is what
      decides where its authenticated listener is: under `strict` it is the
      ordinary port speaking TLS, and under `permissive` it is a second one
      beside the cleartext original.
      */}}
      {{- if eq .Values.tls.mode "strict" }}
      address: https://{{ include "url-shortener.name" . }}-urls:8080
      {{- else if eq .Values.tls.mode "permissive" }}
      address: https://{{ include "url-shortener.name" . }}-urls:{{ .Values.tls.port }}
      {{- else }}
      address: http://{{ include "url-shortener.name" . }}-urls:8080
      {{- end }}
    events:
      nats:
        url: {{ .Values.events.url }}
        {{- with .Values.events.auth.audience }}
        {{- /* The broker authenticates its clients; the token is
        a projected ServiceAccount token this pod cannot forge. */}}
        tokenFile: /var/run/events/token
        {{- end }}
      consumer:
        stream: {{ .Values.events.stream }}
        durable: {{ .Values.events.consumers.stat }}
        subject: {{ .Values.events.redirectSubject }}

  web.yaml: |
    listen:
      address: ":8080"
    probes:
      address: ":7070"
    log:
      level: {{ .Values.log.level }}
    drain:
      seconds: {{ .Values.drain.seconds }}
    {{- if include "url-shortener.tlsOn" . }}
    tls:
      {{- /*
      `strict` whenever the transport is on, for the same reason the counter
      renders it: the front end SERVES a page but it does not serve this
      boundary, and for the call it makes there is no third state. Its own
      listener is the browser's, and the browser is outside the mesh of
      workload identities — that edge is the gateway's to terminate.
      */}}
      mode: strict
      certFile: {{ .Values.tls.mountPath }}/tls.crt
      keyFile: {{ .Values.tls.mountPath }}/tls.key
      caFile: {{ .Values.tls.mountPath }}/ca.crt
      trustDomain: {{ required "tls.trustDomain is required once tls.mode is not off: without it a peer from any trust domain is admitted" .Values.tls.trustDomain }}
      peers:
        - namespace: {{ .Release.Namespace }}
          serviceAccount: {{ include "url-shortener.appServiceAccountName" . }}
    {{- end }}
    urls:
      {{- if eq .Values.tls.mode "strict" }}
      address: https://{{ include "url-shortener.name" . }}-urls:8080
      {{- else if eq .Values.tls.mode "permissive" }}
      address: https://{{ include "url-shortener.name" . }}-urls:{{ .Values.tls.port }}
      {{- else }}
      address: http://{{ include "url-shortener.name" . }}-urls:8080
      {{- end }}
    assets:
      directory: /app/assets

  log.yaml: |
    probes:
      address: ":7070"
    log:
      level: {{ .Values.log.level }}
    drain:
      seconds: {{ .Values.drain.seconds }}
    events:
      nats:
        url: {{ .Values.events.url }}
        {{- with .Values.events.auth.audience }}
        {{- /* The broker authenticates its clients; the token is
        a projected ServiceAccount token this pod cannot forge. */}}
        tokenFile: /var/run/events/token
        {{- end }}
      consumer:
        stream: {{ .Values.events.stream }}
        durable: {{ .Values.events.consumers.log }}
        subject: {{ .Values.events.requestSubject }}
    archive:
      bucket:
        name: {{ required "archive.bucket.name is required: a component that archives to a bucket nobody named has nowhere to write" .Values.archive.bucket.name }}
        {{- with .Values.archive.bucket.region }}
        region: {{ . }}
        {{- end }}
        {{- with .Values.archive.bucket.endpoint }}
        endpoint: {{ . }}
        {{- end }}
        {{- with .Values.archive.bucket.ca }}
        ca: {{ . }}
        {{- end }}
        {{- if .Values.archive.bucket.pathStyle }}
        pathStyle: true
        {{- end }}
        {{- if .Values.archive.bucket.credentialsSecret }}
        credentialsEnv:
          accessKeyID: S3_ACCESS_KEY_ID
          secretAccessKey: S3_SECRET_ACCESS_KEY
        {{- end }}
      prefix: {{ .Values.archive.prefix }}
      batch:
        maxRecords: {{ .Values.archive.batch.maxRecords }}
        maxSeconds: {{ .Values.archive.batch.maxSeconds }}
