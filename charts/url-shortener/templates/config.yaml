{{/*
One ConfigMap per binary, holding exactly the file that binary validates
against its own schema at start-up.

This is the configuration contract's first rule made real: the chart and the
binary read ONE schema, so a key this chart renders that the binary does not
know is a test failure here rather than a default nobody chose in a cluster.
The test that proves it is chart_test.go, which pulls these files out of a
render and validates them with the binary's schema.

The migration's file is NOT here — it is in migrate.yaml, as part of the
hook. See that file for why.

No secret appears in any of them. The database password is NAMED — the
component reads the variable the file points at.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "url-shortener.name" . }}-config
  labels: {{- include "url-shortener.labels" . | nindent 4 }}
data:
  redirect.yaml: |
    listen:
      address: ":8080"
    probes:
      address: ":7070"
    log:
      level: {{ .Values.log.level }}
    drain:
      seconds: {{ .Values.drain.seconds }}
    {{- if include "url-shortener.tlsOn" . }}
    tls:
      mode: {{ .Values.tls.mode }}
      {{- if eq .Values.tls.mode "permissive" }}
      address: ":{{ .Values.tls.port }}"
      {{- end }}
      certFile: {{ .Values.tls.mountPath }}/tls.crt
      keyFile: {{ .Values.tls.mountPath }}/tls.key
      caFile: {{ .Values.tls.mountPath }}/ca.crt
      trustDomain: {{ required "tls.trustDomain is required once tls.mode is not off: without it a peer from any trust domain is admitted" .Values.tls.trustDomain }}
      peers:
        {{- range .Values.tls.peers.redirect }}
        - namespace: {{ .namespace }}
          serviceAccount: {{ .serviceAccount }}
        {{- end }}
    {{- end }}
    database:
      url: postgres://{{ .Values.database.app.role }}@{{ .Values.database.host }}:5432/{{ .Values.database.name }}?sslmode=require
      passwordEnv: DATABASE_PASSWORD
      maxConnections: 10
    events:
      nats:
        url: {{ .Values.events.url }}
      redirectSubject: {{ .Values.events.redirectSubject }}
      requestSubject: {{ .Values.events.requestSubject }}

  stat.yaml: |
    probes:
      address: ":7070"
    log:
      level: {{ .Values.log.level }}
    drain:
      seconds: {{ .Values.drain.seconds }}
    database:
      url: postgres://{{ .Values.database.app.role }}@{{ .Values.database.host }}:5432/{{ .Values.database.name }}?sslmode=require
      passwordEnv: DATABASE_PASSWORD
    events:
      nats:
        url: {{ .Values.events.url }}
      consumer:
        stream: {{ .Values.events.stream }}
        durable: {{ .Values.events.consumers.stat }}
        subject: {{ .Values.events.redirectSubject }}

  log.yaml: |
    probes:
      address: ":7070"
    log:
      level: {{ .Values.log.level }}
    drain:
      seconds: {{ .Values.drain.seconds }}
    events:
      nats:
        url: {{ .Values.events.url }}
      consumer:
        stream: {{ .Values.events.stream }}
        durable: {{ .Values.events.consumers.log }}
        subject: {{ .Values.events.requestSubject }}
    archive:
      bucket:
        name: {{ required "archive.bucket.name is required: a component that archives to a bucket nobody named has nowhere to write" .Values.archive.bucket.name }}
        {{- with .Values.archive.bucket.region }}
        region: {{ . }}
        {{- end }}
        {{- with .Values.archive.bucket.endpoint }}
        endpoint: {{ . }}
        {{- end }}
        {{- with .Values.archive.bucket.ca }}
        ca: {{ . }}
        {{- end }}
        {{- if .Values.archive.bucket.pathStyle }}
        pathStyle: true
        {{- end }}
        {{- if .Values.archive.bucket.credentialsSecret }}
        credentialsEnv:
          accessKeyID: S3_ACCESS_KEY_ID
          secretAccessKey: S3_SECRET_ACCESS_KEY
        {{- end }}
      prefix: {{ .Values.archive.prefix }}
      batch:
        maxRecords: {{ .Values.archive.batch.maxRecords }}
        maxSeconds: {{ .Values.archive.batch.maxSeconds }}
