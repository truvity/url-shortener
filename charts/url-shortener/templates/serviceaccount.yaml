{{/*
The accounts this release's workloads run as. Two of them, and one is a HOOK.

The chart GRANTS nothing. It names accounts and puts annotations on them;
binding an account to rights outside the cluster is the platform's job, and
the mechanism differs between clusters in one estate. Leaving the annotations
open is what makes this chart installable on either kind.

Two rather than one, for the same reason there are two database credentials:
the migration creates tables and grants rights, the services read and write
rows. One account for both jobs puts the migration's rights on the request
path.

WHY THE MIGRATION'S IS A HOOK, and this is the third time this has bitten:
Helm applies every hook before anything else in the release, so a hook can
only reference things that are themselves hooks. A hook Job naming an
ordinary ServiceAccount does not fail on the Job — it fails on the POD, which
is never created at all, with `error looking up service account` in an event
nobody is watching, while the install sits at "Job in progress" until it
times out.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "url-shortener.appServiceAccountName" . }}
  labels: {{- include "url-shortener.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.app.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "url-shortener.migrateServiceAccountName" . }}
  labels: {{- include "url-shortener.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    # Before the migration's own configuration at -5, and well before the
    # Job at 0.
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.serviceAccount.migrate.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
