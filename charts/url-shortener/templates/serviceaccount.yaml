{{/*
The accounts this release's workloads run as: one per component, and the
migration's, which is a HOOK.

The chart GRANTS nothing. It names accounts and puts annotations on them;
binding an account to rights outside the cluster is the platform's job, and
the mechanism differs between clusters in one estate. Leaving the annotations
open is what makes this chart installable on either kind.

One PER COMPONENT, because a workload identity is namespace plus account: a
shared account makes two components indistinguishable to an allow-list. The
migration has its own for the same reason it has its own database
credential: its rights create tables and must stay off the request path.

WHY THE MIGRATION'S IS A HOOK, and this is the third time this has bitten:
Helm applies every hook before anything else in the release, so a hook can
only reference things that are themselves hooks. A hook Job naming an
ordinary ServiceAccount does not fail on the Job — it fails on the POD, which
is never created at all, with `error looking up service account` in an event
nobody is watching, while the install sits at "Job in progress" until it
times out.
*/}}
{{- include "url-shortener.checkComponentAccounts" . }}
{{- if .Values.serviceAccount.create }}
{{- range (list "redirect" "urls" "web" "stat" "log") }}
{{- $name := include "url-shortener.componentServiceAccountName" (dict "root" $ "component" .) }}
{{- /* `app.annotations` is the cloud binding, so it belongs to `log` alone. */}}
{{- $annotations := merge (deepCopy ((get ($.Values.serviceAccount.components | default dict) . | default dict).annotations | default dict)) (ternary ($.Values.serviceAccount.app.annotations | default dict) dict (eq . "log")) }}
{{ include "service-lib.serviceAccount" (dict "context" $ "name" . "platform" (dict "serviceAccount" (dict "name" $name "annotations" $annotations))) }}
---
{{- end }}
{{- /* Before the migration's own configuration at -5, and well before the Job at 0. */}}
{{- $hook := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-weight" "-10" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" }}
{{ include "service-lib.serviceAccount" (dict "context" $ "name" "migrate" "platform" (dict "serviceAccount" (dict "name" (include "url-shortener.migrateServiceAccountName" .) "annotations" (merge (deepCopy $hook) (deepCopy (.Values.serviceAccount.migrate.annotations | default dict)))))) }}
{{- end }}
