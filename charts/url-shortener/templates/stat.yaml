{{/*
The click counter. A consumer, so it has no Service and no route: nothing
calls it, it calls the stream.

It still serves probes, because an orchestrator needs to know whether a
consumer is alive and whether it is connected to what it consumes. That is
the one thing a workload with no traffic still owes the platform.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "url-shortener.name" . }}-stat
  labels: {{- include "url-shortener.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.stat }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # The replacement is READY before the incumbent is touched.
      # The default is 25%, which on two replicas means one goes
      # away first.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: stat
  template:
    metadata:
      labels:
        {{- include "url-shortener.labels" . | nindent 8 }}
        app.kubernetes.io/component: stat
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "url-shortener.appServiceAccountName" . }}
      {{- include "url-shortener.podSecurity" . | nindent 6 }}
      {{- include "url-shortener.drain" . | nindent 6 }}
      {{- include "url-shortener.spread" (dict "Release" .Release "component" "stat") | nindent 6 }}
      containers:
        - name: stat
          image: {{ include "url-shortener.image" (dict "Values" .Values "root" $ "component" "stat") }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          args: ["-config", "/etc/url-shortener/stat.yaml"]
          env:
            {{- include "url-shortener.telemetryEnv" (dict "root" $ "component" "stat") | nindent 12 }}
            {{- include "url-shortener.passwordEnv" .Values.database.app | nindent 12 }}
          ports:
            - name: probes
              containerPort: 7070
          livenessProbe:
            httpGet: { path: /health/live, port: probes }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: probes }
            periodSeconds: 5
          {{- include "url-shortener.preStop" . | nindent 10 }}
          volumeMounts:
            {{- include "url-shortener.eventsTokenMount" . | nindent 12 }}
            - name: config
              mountPath: /etc/url-shortener
              readOnly: true
            {{- include "url-shortener.identityMount" . | nindent 12 }}
          resources: {{- toYaml .Values.resources.stat | nindent 12 }}
      volumes:
        {{- include "url-shortener.eventsTokenVolume" . | nindent 8 }}
        - name: config
          configMap:
            name: {{ include "url-shortener.name" . }}-config
        {{- include "url-shortener.identityVolume" . | nindent 8 }}
