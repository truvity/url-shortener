{{/*
The redirect service. Two listeners: its own traffic, and probes.

The probe listener is separate and is NOT in the Service. Readiness must be
answerable when the service's own listener is saturated, which is exactly
when somebody is asking, and a probe endpoint reachable from outside is an
information leak nobody meant to ship.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "url-shortener.name" . }}-redirect
  labels: {{- include "url-shortener.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.redirect }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # The replacement is READY before the incumbent is touched.
      # The default is 25%, which on two replicas means one goes
      # away first.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: redirect
  template:
    metadata:
      labels:
        {{- include "url-shortener.labels" . | nindent 8 }}
        app.kubernetes.io/component: redirect
      annotations:
        # Restart on a configuration change. Without this a `helm upgrade`
        # that only edits the ConfigMap changes nothing at all: the pods keep
        # the file they started with, and the deploy reads as successful.
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "url-shortener.appServiceAccountName" . }}
      {{- include "url-shortener.podSecurity" . | nindent 6 }}
      {{- include "url-shortener.drain" . | nindent 6 }}
      {{- include "url-shortener.spread" (dict "Release" .Release "component" "redirect") | nindent 6 }}
      containers:
        - name: redirect
          image: {{ include "url-shortener.image" (dict "Values" .Values "root" $ "component" "redirect") }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          args: ["-config", "/etc/url-shortener/redirect.yaml"]
          env:
            {{- include "url-shortener.telemetryEnv" (dict "root" $ "component" "redirect") | nindent 12 }}
            {{- include "url-shortener.passwordEnv" .Values.database.app | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            - name: probes
              containerPort: 7070
            {{- if include "url-shortener.tlsOn" . }}
            {{- if eq .Values.tls.mode "permissive" }}
            {{/*
            Two ports, deliberately. One listener cannot be both cleartext
            and authenticated in every runtime, so an edge migrates in three
            commits — this server adds its authenticated port, its callers
            move to it, and the cleartext one goes.
            */}}
            - name: https
              containerPort: {{ .Values.tls.port }}
            {{- end }}
            {{- end }}
          livenessProbe:
            # Nothing but the process. A liveness probe that checks a
            # dependency restarts a healthy process and makes an outage worse.
            httpGet: { path: /health/live, port: probes }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: probes }
            periodSeconds: 5
          {{- include "url-shortener.preStop" . | nindent 10 }}
          volumeMounts:
            {{- include "url-shortener.eventsTokenMount" . | nindent 12 }}
            - name: config
              mountPath: /etc/url-shortener
              readOnly: true
            {{- include "url-shortener.identityMount" . | nindent 12 }}
          resources: {{- toYaml .Values.resources.redirect | nindent 12 }}
      volumes:
        {{- include "url-shortener.eventsTokenVolume" . | nindent 8 }}
        - name: config
          configMap:
            name: {{ include "url-shortener.name" . }}-config
        {{- include "url-shortener.identityVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "url-shortener.name" . }}-redirect
  labels: {{- include "url-shortener.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redirect
  ports:
    - name: http
      port: 8080
      targetPort: http
    {{- if and (include "url-shortener.tlsOn" .) (eq .Values.tls.mode "permissive") }}
    - name: https
      port: {{ .Values.tls.port }}
      targetPort: https
    {{- end }}
{{- if .Values.route.enabled }}
---
{{/*
The route, and it names its parent.

A route with no parent attaches to whatever the cluster's default happens to
be, which is nothing in most clusters and the wrong gateway in the rest. It
renders as healthy with zero attached routes, and the only symptom is a 404
nobody can explain.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "url-shortener.name" . }}-redirect
  labels: {{- include "url-shortener.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "route.parentRef.name is required when route.enabled is true: a route that names no parent attaches nowhere" .Values.route.parentRef.name }}
      {{- /*
      The parent's KIND, because a Gateway is not the only thing a route
      can attach to and the default is silently wrong where it is not.
      A route naming a kind nothing serves is ACCEPTED -- the status says
      so, and keeps saying so -- and answers 404. The only other signal is
      the listener reporting zero attached routes, which nobody watches.
      */}}
      {{- with .Values.route.parentRef.group }}
      group: {{ . }}
      {{- end }}
      {{- with .Values.route.parentRef.kind }}
      kind: {{ . }}
      {{- end }}
      {{- with .Values.route.parentRef.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.route.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .Values.route.hostname }}
  hostnames: [{{ . | quote }}]
  {{- end }}
  rules:
    {{/*
    The rule is NAMED. A policy attaches to a rule by name, and a policy
    whose target names no rule is not refused — it is simply not attached,
    and the route keeps serving without it.
    */}}
    - name: {{ .Values.route.ruleName }}
      matches:
        - path:
            type: PathPrefix
            value: /r/
      backendRefs:
        {{- /*
        group, kind and weight are DECLARED, not left to default.

        The API server fills them in, so a chart that omits them renders
        a route that never matches what is stored: a continuous
        difference in every renderer that compares the two, for a route
        nobody changed. The alternative -- telling the comparer to ignore
        those fields -- silences the real changes underneath them too.

        Declaring a default is not duplication. It is saying which value
        this chart wants, in a place a reader can see it.
        */}}
        - group: ""
          kind: Service
          name: {{ include "url-shortener.name" . }}-redirect
          port: 8080
          weight: 1
{{- end }}
