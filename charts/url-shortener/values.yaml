# The name THIS install is known by. Empty means this chart's own release
# name, which is what a standalone install needs and what a platform that
# installs both charts under one release name never has to set.
#
# It is folded into the NATS subject and durable consumer names below, so
# that two installs sharing a namespace, or sharing a release name in
# different namespaces, get different names instead of finding each
# other's — see templates/_helpers.tpl. Set this only when the
# infrastructure release this install connects to is NOT this release's
# own name; then it must be that release's own installName, exactly.
installName: ""

# Where this service's database and stream are.
#
# It does not create them: url-shortener-infra does, as a separate release
# with a separate lifetime. That split is an ordering requirement rather than
# a preference — the migration below runs as a pre-install hook, and Helm runs
# hooks before it applies anything else in the same release, so a chart that
# created its own database could never migrate it.

database:
  # The read-write service of the cluster url-shortener-infra created, for
  # example `<infra release>-pg-rw`.
  #
  # REQUIRED and not set here: `host` is a value only an install can give, so
  # the schema asks for a non-empty one and this file leaves the key out
  # rather than shipping an empty placeholder.
  name: url_shortener

  # How the connection is secured: ALWAYS verify-full. The database client
  # (the platform's PostgreSQL client library, which reads libpq's PGHOST,
  # PGSSLROOTCERT and friends from this chart's environment) proves who
  # answered: the server certificate must chain to the root below AND name the
  # host dialled. It refuses `require`, and refuses to start without a root,
  # so there is no weaker setting to choose; `mode` is kept for a platform
  # that already sets it, and accepts only `verify-full`.
  #
  # The host is dialled by its fully-qualified name,
  # `<host>.<release namespace>.svc.<clusterDomain>` (a host that already has
  # a dot is left as given), because that is the form a server certificate
  # carries.
  tls:
    mode: verify-full
    # The ConfigMap holding the root the server certificate chains to. The
    # platform provides it; REQUIRED. It is mounted as a DIRECTORY into
    # `redirect`, `urls` and the migration, so a rotation of the root reaches
    # a running pod without a restart (the client re-reads the file for every
    # new connection).
    rootCA:
      configMapName: ""
      key: ca-certificates.crt
  # The cluster's DNS suffix, for the fully-qualified host above.
  clusterDomain: cluster.local

  # TWO roles, with two credentials, because they are trusted with different
  # things. The migration creates tables and grants rights; the services read
  # and write rows and can do neither. Giving both jobs one account is the
  # shortcut that makes "the service dropped a table" a sentence anyone can
  # say.
  #
  # Each role names the SECRET holding its password, and the key inside it.
  # No value appears in this file or in anything it renders. The password
  # reaches the process as a mounted FILE the client re-reads for every new
  # connection, so a rotated Secret is picked up without a restart.
  owner:
    role: url_shortener_owner
    # `passwordSecret` is REQUIRED and not set here, as `host` above.
    passwordKey: password
  app:
    role: url_shortener_app
    # `passwordSecret` is REQUIRED and not set here, as `host` above.
    passwordKey: password

events:
  # `url` is REQUIRED and not set here, as `database.host` above.

  # The stream, its two subjects and the two durable consumer names are
  # NOT here. All five are cluster-global on the broker, computed from
  # `installName` above rather than taken as values — see
  # templates/_helpers.tpl for why a value would be the wrong fix, and
  # `docs/guides/events.md` for the collision a value used to allow. A
  # durable name is still one per consuming component, shared by every
  # replica of it: that is what makes the replicas ONE consumer group
  # rather than several copies of the same work, and what lets a restart
  # resume where it left off instead of replaying the stream or losing
  # what arrived while it was gone.

  # The broker authenticates its clients, or it does not.
  #
  # An AUDIENCE, not a credential: the platform projects a ServiceAccount
  # token for it, the pod cannot forge one, and nothing here is a secret
  # to leak. Empty means the broker admits anonymous clients, which is
  # what a local one does -- and what a laptop needs.
  #
  # A broker that authenticates and a client that does not send anything
  # fails as `Authorization Violation` at connect time, which reads like
  # a broken password rather than a missing mount.
  auth:
    audience: ""
    expirationSeconds: 3600

  # Authenticate the REDIRECT component to the broker with its workload
  # identity instead of a token: the certificate the platform mounts for
  # `tls` (so `tls.mode` must not be off for redirect) is presented over
  # TLS, and the broker maps the identity in it to a user with its own
  # permissions -- what redirect may publish is the broker's decision.
  # Off by default, and then redirect sends its token exactly as before.
  #
  # When on, redirect sends NO token: a certificate the broker cannot map
  # must fail at connect, not fall through to the token path and succeed
  # with the account's full rights, which would read as a working setup.
  # `stat` and `log` are unaffected and keep their tokens.
  tls:
    enabled: false
    # The name the broker's certificate was issued for, when that is not
    # the host in `events.url`. Empty verifies the host dialled.
    serverName: ""
    # A ConfigMap in this namespace holding the trust bundle the broker's
    # certificate is verified against. Required when enabled. The
    # BROKER's chain, which is usually not the workload identity's.
    caConfigMap: ""
    caKey: ca-certificates.crt

# Where the request archive goes.
#
# The vendor is not in here. An endpoint, a region and a path-style flag
# reach a cloud service, a store inside the cluster or a test double, and the
# component cannot tell which it got — platform.md §4. The local cluster
# points this at its own S3; a deployment points it at whatever the platform
# has.
archive:
  bucket:
    # It exists already. A service does not create its own store: a component
    # that can create a bucket can create it in the wrong account, with the
    # wrong retention, and nothing notices until somebody looks.
    #
    # `name` is REQUIRED and not set here, as `database.host` above.
    region: ""
    # Unset means the SDK's own resolution for the region.
    endpoint: ""
    # Required by most non-cloud implementations.
    pathStyle: false
    # A bundle the platform mounts, for a store whose endpoint is not signed
    # by a public root. Unset means the system trust store.
    ca: ""
    # The Secret holding static credentials, and the keys inside it. EMPTY is
    # the better answer: it means the SDK's ambient credentials, which is
    # what a workload identity provides and what leaves nothing to leak.
    credentialsSecret: ""
    accessKeyIDKey: accessKeyID
    secretAccessKeyKey: secretAccessKey
  # What every key this component writes begins with. A bucket is usually
  # shared, and a component that writes to the root of one cannot be granted
  # permission to write only its own objects.
  prefix: url-shortener/requests
  # When an object is closed. Both limits apply, whichever is reached first:
  # a size-only rule never archives a quiet hour, and a time-only rule
  # archives a busy one in objects too small to be worth reading.
  batch:
    maxRecords: 500
    maxSeconds: 60

# Where each component's image is.
#
# ONE ENTRY PER COMPONENT, and four fields rather than one string, because
# that is the shape a release stamps into: the build writes a manifest of
# what it just pushed, `helmctl package --manifest` merges it here, and
# `--require-image-digests` refuses to publish a chart where any entry's
# digest is still empty.
#
# That last part is why the shape is not a matter of taste. The check reads
# THIS map and nothing else, so a chart that spelled its images another way
# would pass it with nothing to check — and publish mutable references
# under a flag saying it had not. The first version of this chart did
# exactly that, and the first install of it failed on an image nobody had
# stamped.
#
# Unstamped, the chart falls back to its own appVersion, which is what a
# `helm install` from a checkout gets. A published chart always carries
# digests.
images:
  migrate: {registry: ghcr.io, repository: truvity/policy/url-shortener/migrate, tag: "", digest: ""}
  redirect: {registry: ghcr.io, repository: truvity/policy/url-shortener/redirect, tag: "", digest: ""}
  urls: {registry: ghcr.io, repository: truvity/policy/url-shortener/urls, tag: "", digest: ""}
  stat: {registry: ghcr.io, repository: truvity/policy/url-shortener/stat, tag: "", digest: ""}
  log: {registry: ghcr.io, repository: truvity/policy/url-shortener/log, tag: "", digest: ""}
  web: {registry: ghcr.io, repository: truvity/policy/url-shortener/web, tag: "", digest: ""}

pullPolicy: IfNotPresent

# Telemetry, as OpenTelemetry's own environment variables (decision 0006).
#
# These leave this chart as VARIABLES rather than as configuration file
# keys, because the specification defines them and every language's SDK
# reads them without being asked. They live here anyway, beside the rest
# of the service's configuration, so that a reviewer reads them in one
# place.
otel:
  # NO ENDPOINT MEANS DO NOT EXPORT -- not "export to localhost and retry
  # forever", which is what an SDK does when left to its default. That is
  # what a laptop needs, and it is why no service here carries an enable
  # flag: a flag is a thing nothing sets in the deployment that needed it.
  endpoint: ""
  protocol: http/protobuf

  # Sampling is a deployment's decision and turning it down must not need
  # a release. Parent-based, so a sampled trace stays whole across
  # services instead of losing every second hop.
  tracesSampler: parentbased_traceidratio
  sampleRatio: "0.1"

  # Extra resource attributes, as a map. They ride along as pod-level
  # fields -- only three resource attributes become metric LABELS
  # (cluster, namespace, environment) and the rest land on `target_info`
  # and nowhere else, so anything to be filtered on must be a metric
  # attribute rather than one of these.
  resourceAttributes: {}

log:
  level: info

# The accounts these workloads run as.
#
# The chart grants nothing. It names accounts and puts annotations on them;
# which mechanism binds an account to a cloud role is the platform's, and
# it differs between clusters in the same estate. A chart that hard-codes one
# of them can only be installed on half the clusters it should run on, and
# the failure arrives as a permissions error a long way from the cause.
#
# EVERY component runs as its OWN account, always: `redirect`, `urls`,
# `web`, `stat` and `log`, `<release>-<component>` by default. A workload
# identity is namespace plus account, so a shared account would make two
# components indistinguishable to an allow-list. The chart's own grants
# follow: `urls` admits exactly `web`'s and `stat`'s accounts, `redirect`
# admits nothing internally, and `web` and `stat` accept an answer only from
# `urls`' own account. External callers, in `tls.peers`, are unchanged.
#
# The migration has its own too, for the reason it has its own database
# credential: it creates tables and grants rights.
#
# No two may resolve to the same name, nor one to the migration's: the
# render refuses it.
serviceAccount:
  # false where the platform creates the accounts (they must then exist).
  create: true

  # The account `log` runs as when `components.log.name` is empty: the one
  # a platform bound a cloud role to for the archive bucket, which `log`
  # alone needs. Empty means `<release>-log`. NOTHING ELSE runs as it.
  # These annotations go on `log`'s account only.
  app:
    name: ""
    annotations: {}
  migrate:
    name: ""
    annotations: {}

  # Per-component overrides. Keys: redirect, urls, web, stat, log. An empty
  # name means the default above.
  components: {}
  #  urls:
  #    name: ""
  #    annotations: {}

# How long a replacement takes, and how long the old one is allowed to
# finish.
#
# ONE number, used three times: the service's own shutdown timeout in its
# configuration file, the grace period Kubernetes grants, and the pre-stop
# delay before either starts. They disagree by default, and both ways of
# disagreeing look like a network fault — a grace period shorter than the
# timeout kills a draining process, and no pre-stop delay means traffic
# keeps arriving for as long as it takes the routing layer to notice the
# endpoint is gone.
drain:
  # What the service is given to finish in-flight work.
  seconds: 20
  # Fail readiness, then wait this long before the drain starts, so that
  # whatever routes traffic has removed this endpoint first.
  preStopSeconds: 5

# Who the process is, inside the pod.
#
# The runtime images already run as an unprivileged user; this states it
# where a reader and an admission policy can both see it, and sets the group
# that the platform's mounts are made readable to. Without the group, an
# identity mounted by a CSI driver is owned by root and the process cannot
# read its own certificate — which surfaces as a permission error on a
# certificate authority file, a long way from anything that says identity.
podSecurity:
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

# Mutually authenticated transport, where the PLATFORM provides the identity.
#
# `off` is the default and always will be. A chart is installable by someone
# whose platform provides none of this, and a default that assumed one would
# produce a pod waiting forever for a volume nobody serves. Turning it on is
# a decision a platform makes for every service at once.
#
# What a platform must have before `off` can become anything else:
#   - something that mounts a certificate whose identity is derived from the
#     account the pod runs as, by something the pod cannot lie to;
#   - something that REFUSES a request for an identity other than the
#     requester's, and nothing else approving requests behind its back;
#   - an authority that signs it, and a trust bundle to verify peers against;
#   - rotation, without restarting workloads.
#
# The middle one is the one that is missed, and missing it is invisible: the
# certificates still mount and every log line still says success.
tls:
  # off | permissive | strict. `permissive` serves BOTH, on two ports, so one
  # edge migrates at a time; it is a migration state and should carry a date.
  mode: "off"

  # Per-component override of `mode`, for the two components that SERVE an
  # authenticated boundary: `urls` and `redirect`. Unset means `mode`, so a
  # release that never heard of this renders exactly as before.
  #
  #   tls:
  #     mode: permissive        # redirect (and the default for urls)
  #     components:
  #       urls:
  #         mode: strict        # only the URL service refuses cleartext
  #
  # `redirect` can NEVER be `strict`, set here or inherited from `mode`: it
  # is fronted by a gateway that terminates TLS at the edge and forwards
  # cleartext, so a strict redirect refuses its only caller. The schema
  # refuses it written down and the render refuses it inherited, so a
  # release-wide `mode: strict` is refused too — name `urls` instead.
  #
  # `web` and `stat` only CALL the URL service and have no mode of their
  # own: they present an identity (client-side `strict`) whenever the URL
  # service authenticates at all, and dial its port for its effective mode.
  # Everything that calls `urls` from outside this release (the e2e Job, the
  # prober) must be granted in `peers.urls` below BEFORE it is made strict.
  components: {}

  # The root of every identity this service will admit. A peer from another
  # trust domain is refused before its account is considered.
  trustDomain: ""

  # What mounts the identity, and where. The platform owns the first; the
  # chart only has to agree with it.
  csiDriver: spiffe.csi.cert-manager.io
  mountPath: /var/run/identity

  # The identity is requested AS the workload's own account — that is what
  # makes it attested rather than claimed — so that account needs permission
  # to ask. Set false where the platform grants this centrally.
  grantRequest: true

  # The port the authenticated listener uses under `permissive`, beside the
  # cleartext one. Under `strict` the cleartext port is simply this one's
  # job, so nothing moves.
  port: 8443

  # Who may call, per component. An ACCOUNT, never an address: an address
  # resolves to whoever holds it today. Empty admits nobody, which is the
  # right default for a service nobody has been granted.
  peers:
    redirect: []
    # Callers of the service that owns the tables, from OUTSIDE this release.
    #
    # The release's own counter is granted by the chart, because the chart is
    # what wired it. A chart whose default configuration cannot talk to
    # itself is a chart that installs and then sits refused at the handshake,
    # naming a certificate rather than a list nobody filled in.
    urls: []

# The front end's own settings, rendered into its configuration file.
web:
  # The Content-Security-Policy the front end sends. REPORT-ONLY by default: a
  # browser reports what the policy would have blocked and blocks nothing, so
  # it cannot break a page. Set `enforce` once the reports are quiet, or `off`
  # to send no header at all.
  csp:
    mode: report-only
    # Origins the page may connect to besides its own (`connect-src 'self'`
    # plus these): bare origins such as `https://collector.example`.
    connectSrc: []
    # Where browsers POST violation reports. Empty adds no report-uri.
    reportUri: ""

  # Browser telemetry (Grafana Faro), OFF by default: with it off the page
  # sends nothing and the Faro libraries are never downloaded.
  #
  # This is runtime configuration, because one build is promoted unchanged
  # from environment to environment and so cannot carry a collector address.
  # Everything here is written into the page for every visitor to read.
  # `apiKey` is a PUBLIC identifier of this app at the collector, paired with
  # the collector's origin allow-list; it is not a secret, and no credential
  # may be put in this block.
  #
  # The collector is reached on THIS page's own origin by default, at
  # `/faro/collect`, which the gateway routes to the collector (see
  # `route.faro`): same-origin, so `connect-src 'self'` already allows it and
  # no CORS is involved. An absolute https URL is allowed instead, and its
  # origin is then added to connect-src.
  faro:
    enabled: false
    collectorUrl: /faro/collect
    apiKey: ""
    appName: url-shortener-web
    # A label for where this install runs, for example `devel`.
    environment: ""
    # The fraction of browser sessions that report anything, 0 to 1.
    sampleRate: 1

replicas:
  # Two, because one instance cannot be replaced without a gap whatever the
  # strategy says. Both components run more than one safely: the redirect
  # service holds no state, and the counter is a queue-group consumer.
  redirect: 2
  stat: 2
  log: 2
  urls: 2
  web: 2

# Voluntary disruption, which is not the same thing as a rollout.
#
# `maxUnavailable: 0` above makes a ROLLOUT gapless. This makes a node drain
# gapless too, and they are different events: nothing stops a cluster
# autoscaler from evicting both replicas at once while every deployment sits
# idle and healthy.
disruption:
  enabled: true
  maxUnavailable: 1

resources:
  redirect:
    requests: { cpu: 50m, memory: 64Mi }
  stat:
    requests: { cpu: 50m, memory: 64Mi }
  log:
    requests: { cpu: 50m, memory: 128Mi }
  urls:
    requests: { cpu: 50m, memory: 64Mi }
  web:
    requests: { cpu: 50m, memory: 96Mi }
  migrate:
    requests: { cpu: 50m, memory: 64Mi }
  verify:
    requests: { cpu: 50m, memory: 64Mi }

# The route this service is reached through. Off by default: a chart that
# exposes something the moment it is installed is a chart that exposes
# something nobody decided to expose.
route:
  enabled: false
  # The name of the rule that serves the application.
  #
  # Rules are named because a policy — for sign-in, for CSRF, for rate
  # limiting — attaches to a rule BY NAME. A policy whose target names no
  # rule that exists does not fail loudly: it is simply not attached, and the
  # route keeps serving without it. An unauthenticated route that looks
  # correct in every rendering is the failure this name exists to prevent.
  ruleName: app
  # The rule that resolves short links, which is a DIFFERENT rule and must
  # stay one. It is public: a short link that demands a sign-in before it
  # resolves is not a short link. Naming it separately is what lets a
  # policy protect the site without locking the resolver.
  redirectRuleName: redirect
  parentRef:
    name: ""
    # The parent's kind and group. Empty means the API's own defaults --
    # a Gateway in `gateway.networking.k8s.io` -- which is right for a
    # cluster that serves routes from Gateways and silently wrong for one
    # that has moved them somewhere else.
    #
    # Silently, because a route whose parent does not exist is still
    # ACCEPTED: the status says so and goes on saying so, and the service
    # answers 404 with nothing pointing at the cause. The only other
    # signal is the listener reporting zero attached routes.
    group: ""
    kind: ""
    namespace: ""
    sectionName: ""
  hostname: ""
  # Optional rule that sends the page's telemetry (`/faro/collect`) to a
  # collector Service, so the page can report on its OWN origin. Off by
  # default. The rule is separate from the site's and carries its own name
  # because it is PUBLIC by design: a browser that has not signed in (or
  # whose session just ended) still needs to report that. What bounds it is
  # the collector's per-app key, origin check, payload cap and rate limit,
  # never a sign-in. Do not attach the site's sign-in policy to it; do not
  # point it at anything but the collector. Only POST on the exact path is
  # matched. A backend in another namespace needs a ReferenceGrant there.
  faro:
    enabled: false
    ruleName: faro
    path: /faro/collect
    # The path the collector expects; empty sends the request unchanged.
    rewritePath: ""
    # The largest request body the gateway accepts on this rule, a Kubernetes
    # quantity such as `256Ki`. Set, it renders a BackendTrafficPolicy
    # (gateway.envoyproxy.io) named `<release name>-faro` that targets this
    # rule alone and buffers the request before forwarding it, answering 413
    # above the limit. Absent (the default) renders no policy; an empty
    # string still means none. A public write endpoint should
    # have one, and the collector's own check happens too late to bound it.
    backend:
      name: ""
      namespace: ""
      port: 0

# Product alerts, as a VMRule (operator.victoriametrics.com). Off by default.
#
# The rules read what the product pushes over OTLP, as a Prometheus-compatible
# store names it:
#   probe_journey_total{journey,result}                end-to-end prober (result is success or failure)
#   rpc_server_call_duration_seconds_*                 urls, per RPC (rpc_method, rpc_response_status_code)
#   http_server_request_duration_seconds_*             redirect and web (http_route, http_response_status_code,
#                                                      url_shortener_component)
# and nothing is scraped. Every rule selects the install's namespace (and,
# remotely, its cluster) and aggregates `by (k8s_cluster_name, ...)`, so a store
# that holds many clusters never mixes them. The prober's rules need the
# end-to-end chart's prober on, with telemetry enabled, in the same namespace
# unless `prober.namespace` says otherwise; the HTTP rules need a release that
# carries the request metrics (the same release as these rules, or later).
alerts:
  enabled: false
  # Labels on the VMRule object, e.g. what a rule selector matches.
  ruleLabels: {}
  # Labels added to EVERY alert, e.g. what an Alertmanager routes by.
  alertLabels: {}
  # Evaluation interval of the group, such as 1m. Absent takes the evaluator's
  # default (`""` is still accepted and means the same).
  # interval: 1m
  # Render ONLY the rule object, for an install that runs on ANOTHER cluster
  # and is evaluated where the shared store's evaluator runs (a platform
  # installs this chart there as a second source). Nothing else renders: no
  # workload, route or database object, and none of the required values above
  # is needed. It implies `alerts.enabled`. The selectors gain
  # `k8s_cluster_name="<clusterName>"` and every alert carries the same label;
  # `namespace` is the one the install runs in on that cluster (the release
  # namespace here is the evaluator's). The rule object is named
  # `<release>-alerts-<clusterName>`.
  remote:
    enabled: false
    # Required with `enabled`; absent otherwise (`""` is still accepted and
    # means absent).
    # clusterName: stage
    # namespace: url-shortener
  # The prober's own namespace when it is not the install's. Absent means the
  # install's own (`""` is still accepted and means the same).
  prober: {}
  # Thresholds. Each alert can be switched off by setting `enabled: false`.
  #
  # Share of the prober's journeys that did not succeed, per journey, over
  # `window`.
  journeyFailing: {enabled: true, ratio: 0.5, window: 15m, for: 10m}
  # The prober sends nothing (down, or telemetry broken). Switch it off where
  # no prober runs.
  proberAbsent: {enabled: true, for: 15m}
  # 99th percentile of the URL service's RPC duration, in seconds.
  urlsRpcLatency: {enabled: true, seconds: 1, for: 15m}
  # Share of the URL service's RPCs that end in one of `codes` (a regular
  # expression over the status; the caller's own refusals -- not found,
  # invalid argument, already exists -- are an answer, not a fault), once
  # there is traffic.
  urlsRpcErrors:
    enabled: true
    ratio: 0.05
    minCallsPerSecond: 0.05
    codes: "INTERNAL|UNKNOWN|UNAVAILABLE|DATA_LOSS|DEADLINE_EXCEEDED"
    for: 10m
  # Share of redirect's / web's HTTP responses that are 5xx, once there is
  # traffic.
  redirectHttp5xx: {enabled: true, ratio: 0.05, minRequestsPerSecond: 0.05, for: 10m}
  webHttp5xx: {enabled: true, ratio: 0.05, minRequestsPerSecond: 0.05, for: 10m}
  # 99th percentile of redirect's / web's request duration, in seconds.
  redirectLatency: {enabled: true, seconds: 0.5, for: 15m}
  webLatency: {enabled: true, seconds: 2, for: 15m}
