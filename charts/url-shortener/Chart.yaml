apiVersion: v2
name: url-shortener
description: >-
  The worked example's deployment: a migration job, the redirect service
  and the click counter, each with the configuration file its binary
  validates at start-up.
type: application
# Both are the placeholder a release stamps. A committed version that
# moves by hand is a version two people can disagree about.
version: 0.0.0
appVersion: "0.0.0"
# The highest delivery interface this chart reads, one number for the three
# charts of the product (docs/contracts/delivery-interface.md). A platform
# renders the keys of every step up to it and compares no version.
annotations:
  delivery.truvity.io/interface: "15"
# The platform pieces of every component come from the library chart
# `service-lib`, which truvity/policy publishes beside its Go module under the
# same version: the pin here is that version, exactly, and the Go module pin
# in go.mod moves with it (a test holds the two together, and renovate.json
# groups them). It is resolved, never copied: `helm dependency build` (which
# `helmctl package` runs itself when a declared dependency is missing from
# charts/) reads the committed Chart.lock and puts the archive under charts/,
# which is ignored.
dependencies:
  - name: service-lib
    version: 1.54.2
    repository: oci://ghcr.io/truvity/charts
