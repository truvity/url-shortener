apiVersion: v2
name: url-shortener
description: >-
  The worked example's deployment: a migration job, the redirect service
  and the click counter, each with the configuration file its binary
  validates at start-up.
type: application
# Both are the placeholder a release stamps. A committed version that
# moves by hand is a version two people can disagree about.
version: 0.0.0
appVersion: "0.0.0"
# The highest delivery interface this chart reads, one number for the three
# charts of the product (docs/contracts/delivery-interface.md). A platform
# renders the keys of every step up to it and compares no version.
annotations:
  delivery.truvity.io/interface: "10"
# The platform pieces of every component come from the library chart beside
# this one. It is VENDORED, committed under charts/service-lib as a copy of
# ../service-lib and held equal to it by a test (`just vendor` refreshes it):
# `helmctl package` does not run `helm dependency update`, so a chart whose
# library arrived only at package time would be published without it.
# An empty repository is Helm's own form for "already in charts/".
dependencies:
  - name: service-lib
    version: 0.0.0
    repository: ""
