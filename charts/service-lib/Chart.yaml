apiVersion: v2
name: service-lib
description: >-
  The platform pieces every service chart renders the same way: a
  Deployment, a ServiceAccount per component, a Service, the probes, the
  mounts, the secret and telemetry environment, and the configuration file
  rendered verbatim from `config`.
# A library renders nothing of its own. A service chart includes its
# templates; see the guide for chart authors (docs/guides/charts.md).
type: library
# The placeholder a release stamps. A committed version that moves by hand
# is a version two people can disagree about.
version: 0.0.0
