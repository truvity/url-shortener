# The database and the stream.
#
# This is a SEPARATE chart from the application, and the reason is ordering
# rather than taste. The application's migration runs as a pre-install hook,
# and Helm runs hooks before it applies anything else in the same release —
# so a chart that creates its own database cannot also migrate it: the hook
# looks for a database the release has not created yet.
#
# That was found by building it the other way first. The ring model this
# mirrors is not ceremony; it is the only ordering that works.

# The name THIS install is known by. Empty means this chart's own release
# name, which is what a standalone install needs and what a platform that
# installs both charts under one release name never has to set.
#
# It is folded into the JetStream stream and subject names below, so that
# two installs sharing a namespace, or sharing a release name in different
# namespaces, get different streams instead of finding each other's — see
# templates/_helpers.tpl. Set this only when the application release this
# install belongs to is NOT this release's own name; then it must be that
# release's name exactly.
installName: ""

# What KIND of install this is, and it decides what gets provisioned.
#
# `test` is the default because it is the one that cannot fail: an
# engineer's namespace typically grants the built-in `admin` role, which
# covers no custom resources at all, so an install that mints them is one
# that engineer cannot perform. A default of `primary` would make the
# common case the broken one.
#
#   test     provisions nothing of its own. It runs as the namespace's
#            standing identity and writes to the store the namespace was
#            already given, under a prefix.
#   primary  provisions the objects this install owns: its store, the
#            identity that reaches it, and the policies for its own flows.
#
# One chart, one interface, two kinds of install.
tier: test

# The objects a `primary` install owns, and the platform NAMES every one.
#
# Nothing here is derived. A chart that builds these names from a
# convention is a chart that disagrees with whatever made them the first
# time, and the disagreement shows up as a second bucket beside the one
# holding the data.
#
# Empty on a `test` install, where none of it is rendered.
cloud:
  # These are AWS resources, and that is not hidden behind a neutral word.
  # The chart renders them only where the platform asked for them, so an
  # install on anything else renders none of it and is not lied to about
  # what it would have got.
  #
  # The store this install writes to.
  bucket: ""
  # The identity that reaches it. One name for the policy and the role,
  # because they are one decision.
  iamName: ""
  # What the trust is scoped to. A workload identity that trusts a cluster
  # rather than THIS cluster, namespace and account is one any pod can
  # assume.
  clusterName: ""
  accountID: ""
  region: ""
  # The account the workloads run as, which the association binds.
  serviceAccount: ""
  # The boundary the platform requires on roles it allows to exist.
  permissionsBoundary: ""

postgres:
  # One instance is an example's answer. A deployment sizes it.
  instances: 1
  storage: 1Gi
  database: url_shortener

  # The owner: the operator creates it with the bootstrap, and its password
  # lands in a secret the operator names `<release>-pg-app`. Only the
  # migration ever uses it.
  ownerRole: url_shortener_owner

  # The role the services run as, and the NAME of the basic-auth secret
  # holding its password. The secret is created outside this chart, for the
  # same reason the application chart takes a name rather than a value.
  #
  # A client certificate would be better -- nothing to generate, nothing to
  # rotate by hand, nothing to leak -- and `contracts/platform.md` says so.
  # It is not offered here yet: the operator mints no certificate for a
  # managed role, and wiring one up needs an issuer signing from the
  # database's own client CA, which is a platform's to provide.
  runtimeRole: url_shortener_app
  # The NAME of a basic-auth secret. Always required, generated or not --
  # the chart does not invent this either, only what goes inside it.
  runtimePasswordSecret: ""

  # WHO fills the name above. False (the default) means a platform
  # generates the password and hands over the name it used. True has the
  # chart mint one itself, from the ExternalSecrets Password generator,
  # INTO that same name -- which is why the name is still required either
  # way: this decides who writes it, not what it is called.
  #
  # Off by default because it is a dependency an install may not have.
  runtimePassword:
    generate: false
    length: 32

  # ---- Below here is the PLATFORM's half, and every key is one of the
  # decisions docs/contracts/platform.md §9 already calls the platform's
  # rather than the project's. Each defaults to nothing, so a stranger
  # installing this on an empty cluster gets what is described above and
  # none of what follows.
  #
  # They are named for the DECISION, not for the operator's field. A
  # platform running a different database operator can still say "these
  # instances belong on that pool" and "archive to that store". It could
  # not say `profile: prod`, which is one estate's vocabulary wearing a
  # chart's clothes.

  # Stamped on the database resource, for whatever reads labels here — cost
  # attribution, a policy, a dashboard's grouping. The chart's own labels
  # are added beside these and win, so a platform cannot rename the thing
  # its own selectors look for.
  labels: {}

  # Where the instances are allowed to run.
  #
  # Not a preference. A database sharing a pool with everything else is one
  # eviction away from a failover nobody asked for, and the pool that
  # prevents that is named differently on every cluster — so the platform
  # names it and the chart passes it through.
  scheduling:
    nodeSelector: {}
    tolerations: []

  # Continuous archiving.
  #
  # A NAME, and nothing else. Not a bucket, not an endpoint, not
  # credentials — the archive is a thing the platform made, and this chart
  # is told what it is called (§1, §6).
  #
  # That is not a simplification, it is the only version that works. The
  # database operator here takes its archive as a resource of its own, with
  # its own compression, retention and credential model; a chart that
  # described one would be describing the wrong one on every platform but
  # the one it was written against, and the difference is invisible until
  # somebody tries a restore.
  #
  # Empty means no archiving, which is the right default for an install
  # nobody has given an archive.
  backup:
    # The archive resource, by name.
    objectStoreName: ""
    # This database's own name inside that archive. It MUST change when the
    # database is rebuilt from nothing: a new cluster writing under the old
    # name interleaves two timelines in one archive, and the damage is only
    # visible at restore.
    serverName: ""

  # The certificate the database SERVER presents, as secret NAMES (§1, §3).
  #
  # Empty means the operator's own per-cluster authority, which is what an
  # install with no platform identity should get. Setting these is how a
  # platform whose workloads verify servers against a shared root makes the
  # database one of them.
  serverTLS:
    secretName: ""
    caSecretName: ""

events:
  # The stream's name and its two subjects are NOT here. Both are
  # cluster-global on the broker, computed from this install's namespace
  # and installName rather than taken as values — see
  # templates/_helpers.tpl for why a value would be the wrong fix, and
  # `docs/guides/events.md` for the collision a value used to allow.
  #
  # Memory keeps the example's events for as long as the example runs.
  # A deployment says `file`.
  storage: memory
  # The NATS server the stream is created on.
  url: nats://nats.nats.svc:4222

  # ---- The platform's half, on the same terms as postgres above.

  # The account this stream is created under.
  #
  # A broker that authenticates its clients gives each tenant an account,
  # and a stream is created INSIDE one. Empty means the operator's own
  # connection — the single-tenant broker an example runs against — and
  # then `url` above is what it dials. Set, the account decides both, and
  # a server list beside it would be the chart arguing with the broker
  # about who this is.
  account: ""

  # How many copies of the stream the broker keeps, and how long it keeps a
  # message. One copy and no age limit is an example's answer; a deployment
  # says three and a duration. Both are the platform's, because they are a
  # durability decision rather than a feature.
  replicas: 1
  maxAge: ""
