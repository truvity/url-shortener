{{- if and .Values.postgres.runtimePassword.generate (not .Values.postgres.runtimePasswordSecret) }}
{{/*
The runtime role's credential, minted for this install.

The chart normally takes the NAME of a secret somebody else made, which
works on any cluster and needs a provider: something has to generate the
password and put it there. A platform can do that for its deployment;
nothing does it for an engineer's copy, and that install fails on a secret
that is simply absent.

So this is the other half of that rule rather than an exception to it: the
provider is named in values and the chart asks it, instead of the chart
inventing a password itself. Off by default, because it is a dependency an
install may not have.
*/}}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Release.Name }}-pg-runtime
  labels:
    app.kubernetes.io/name: url-shortener-infra
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  length: {{ .Values.postgres.runtimePassword.length }}
  digits: 5
  {{- /*
  No symbols. This password is read back into a connection string, and
  every layer between here and the server has its own opinion about
  quoting -- a DSN, a URL, a shell that echoes one while somebody
  debugs. Length is what makes a password hard to guess; punctuation is
  what makes it hard to handle.
  */}}
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-pg-runtime
  labels:
    app.kubernetes.io/name: url-shortener-infra
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- /*
  Generated ONCE and never refreshed, and that is not an optimisation.

  A refresh mints a NEW password. The operator would then update the role
  to match it, and every pod already holding the old one fails on its next
  connection -- an outage with no deploy, no config change and nothing in
  any log but authentication errors. Rotation is a deliberate act with a
  restart beside it, not something a refresh interval does at three in the
  morning.
  */}}
  refreshInterval: "0"
  target:
    name: {{ .Release.Name }}-pg-runtime
    template:
      {{- /*
      basic-auth, because that is what the database operator reads a
      managed role's credential from -- and the username inside it has to
      be the role's, or the operator sets a password for somebody else.
      */}}
      type: kubernetes.io/basic-auth
      data:
        username: {{ .Values.postgres.runtimeRole | quote }}
        password: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Release.Name }}-pg-runtime
{{- end }}
