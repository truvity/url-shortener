{{/*
The database and the stream, both CUSTOM RESOURCES: an operator turns each
into the thing it describes.

That is why this example's tests run against a real cluster rather than a
set of containers. A resource nothing reconciles is accepted, stored, and
never becomes anything — which looks exactly like success from a chart's
side, and like an empty database from the application's.
*/}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-pg
  labels:
    {{- /*
    MERGED, with the chart's winning — not written one after the other. A
    platform that could overwrite `app.kubernetes.io/instance` would be
    renaming the thing this chart's own selectors look for, and the release
    would come apart one resource at a time.

    Merged rather than appended because two lines with the same key are not
    an error anywhere in this path: helm renders them, the API server keeps
    the last, and which one that is depends on the order a template happens
    to write them in. The only place it shows up is a diff nobody reads.
    */}}
    {{- toYaml (merge (dict
        "app.kubernetes.io/name" "url-shortener-infra"
        "app.kubernetes.io/instance" .Release.Name)
        (.Values.postgres.labels | default dict)) | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  storage:
    size: {{ .Values.postgres.storage }}
  bootstrap:
    initdb:
      database: {{ .Values.postgres.database }}
      owner: {{ .Values.postgres.ownerRole }}
  {{- $sched := .Values.postgres.scheduling | default dict }}
  {{- if or $sched.nodeSelector $sched.tolerations }}
  affinity:
    {{- with $sched.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $sched.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- $tls := .Values.postgres.serverTLS | default dict }}
  {{- if or $tls.secretName $tls.caSecretName }}
  {{- /*
  Server TLS only. The client authority, the replication certificate and
  the roles' own credentials stay the operator's — this says what the
  server PRESENTS, not who it admits, and the two are different decisions
  with different blast radii.
  */}}
  certificates:
    {{- with $tls.secretName }}
    serverTLSSecret: {{ . | quote }}
    {{- end }}
    {{- with $tls.caSecretName }}
    serverCASecret: {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- $backup := .Values.postgres.backup | default dict }}
  {{- if $backup.objectStoreName }}
  {{- if not $backup.serverName }}
  {{- fail "postgres.backup.objectStoreName needs postgres.backup.serverName, and it must change when this database is rebuilt from nothing — a second timeline under one name is only visible at restore" }}
  {{- end }}
  {{- /*
  The archive is named, not described. What compresses, what encrypts, how
  long it is kept and who it authenticates as all belong to the resource the
  platform made; this says which one and who this database is inside it.
  */}}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ $backup.objectStoreName | quote }}
        serverName: {{ $backup.serverName | quote }}
  {{- end }}
  managed:
    roles:
      {{- /*
      The role the SERVICES connect as. The operator reconciles it, so it
      exists before anything tries to log in with it, and a change here is
      applied to the running database rather than to a migration nobody
      re-runs.

      It can log in and nothing else. It gets its rights on the tables from
      the migration, which is the only thing holding the owner's password.
      That is the split the application chart's two credentials describe,
      made real on the database's side.
      */}}
      - name: {{ .Values.postgres.runtimeRole }}
        ensure: present
        login: true
        {{- /*
        connectionLimit and inherit are DECLARED, not left to default.

        The API server fills them in from the CRD's schema, so a chart
        that omits them renders a role that never matches what is
        stored: a continuous difference in every renderer that compares
        the two, for a role nobody changed. Telling the comparer to
        ignore them would silence the real changes underneath them too.

        Written out with the operator's own defaults, so this changes
        nothing about the role and only states which values this chart
        wants. -1 is no limit; inheriting is how the role picks up what
        the migration grants it.
        */}}
        connectionLimit: -1
        inherit: true
        passwordSecret:
          name: {{ required "postgres.runtimePasswordSecret is the NAME of a basic-auth secret; the chart does not invent one, though it can be asked to fill it -- see postgres.runtimePassword.generate" .Values.postgres.runtimePasswordSecret }}
---
{{/*
One stream, several subjects. The redirect service publishes to two of them
and the counter consumes one, filtered.

One stream rather than two, because they share a retention decision — and a
consumer that filters by subject is a smaller thing to reason about than two
streams that must never disagree.
*/}}
apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: {{ .Release.Name }}-events
  labels:
    app.kubernetes.io/name: url-shortener-infra
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- /*
  The stream's name and its subjects are CLUSTER-GLOBAL on the broker, so
  they are computed from this install's tenant scope rather than taken as
  values — see _helpers.tpl. Two installs that only differed by namespace
  or only by release name used to find each other's stream here; now
  neither alone repeats the other's name.
  */}}
  name: {{ include "url-shortener-infra.eventsStream" . }}
  subjects:
    - {{ include "url-shortener-infra.redirectSubject" . | quote }}
    - {{ include "url-shortener-infra.requestSubject" . | quote }}
  storage: {{ .Values.events.storage }}
  replicas: {{ .Values.events.replicas | default 1 }}
  {{- with .Values.events.maxAge }}
  maxAge: {{ . | quote }}
  {{- end }}
  {{- if .Values.events.account }}
  {{- /*
  An account, and therefore NO server list. The account carries where the
  broker is and who this is; a `servers` line beside it is the chart
  arguing with the broker about an answer the broker already has.
  */}}
  account: {{ .Values.events.account | quote }}
  {{- else }}
  servers:
    - {{ .Values.events.url }}
  {{- end }}
