apiVersion: v2
name: url-shortener-infra
description: >-
  The database and the stream the example reads and writes. A separate
  chart because it has a separate lifetime: the data outlives every
  deployment of the code that uses it.
type: application
version: 0.0.0
appVersion: "0.0.0"
# The highest delivery interface this chart reads, one number for the three
# charts of the product (docs/contracts/delivery-interface.md). A platform
# renders the keys of every step up to it and compares no version.
annotations:
  delivery.truvity.io/interface: "15"
# The runtime role's credential is the cnpg-database chart's, not this chart's,
# in both modes: a product states the role and the chart renders the Password
# generator and the ExternalSecret (and, where the platform owns the database,
# the DatabaseRole too; `databaseRole: false` where this chart's own Cluster
# declares it). values.yaml says what the platform hands it and
# templates/guard.yaml what must agree with `postgres`.
dependencies:
  - name: cnpg-database
    version: 2.31.0
    repository: oci://ghcr.io/truvity/charts
