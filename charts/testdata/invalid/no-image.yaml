# Neither a digest nor a tag. A render that produced an image reference with
# no version at all would deploy "whatever :latest means today", which is the
# one thing a release exists to prevent.
image:
  repository: example.com/url-shortener
database:
  host: pg-rw
  owner:
    passwordSecret: pg-owner
  app:
    passwordSecret: pg-app
events:
  url: nats://nats:4222
