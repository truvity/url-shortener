# Source: url-shortener/templates/components.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-redirect
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/instance: example
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener
      app.kubernetes.io/instance: example
      app.kubernetes.io/component: redirect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener
        app.kubernetes.io/instance: example
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.0.0"
        app.kubernetes.io/component: redirect
      annotations:
        # Restart on a configuration change. Without this a `helm upgrade`
        # that only edits the ConfigMap changes nothing at all: the pods keep
        # the file they started with, and the deploy reads as successful.
        checksum/config: 0c5c57ef8c71b4d73fade23aa353c013437d034e0dd4a3c2dc85e88e9844d2b7
    spec:
      serviceAccountName: example-redirect
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: url-shortener
              app.kubernetes.io/instance: example
              app.kubernetes.io/component: redirect
      containers:
        - name: redirect
          image: ghcr.io/truvity/policy/url-shortener/redirect:0.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args: ["-config", "/etc/url-shortener/redirect.yaml"]
          env:
            - name: OTEL_SERVICE_NAME
              value: "example-redirect"
            - name: OTEL_TRACES_EXPORTER
              value: "none"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: PGHOST
              value: pg.default.svc.cluster.example
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: url_shortener
            - name: PGUSER
              value: url_shortener_app
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /etc/url-shortener-pg-ca/ca-certificates.crt
            - name: CNPG_CLIENT_PASSWORD_FILE
              value: /etc/url-shortener-pg-password/password
            - name: PGAPPNAME
              value: example-redirect
            - name: CNPG_CLIENT_POOL_MAX
              value: "10"
          ports:
            
            - name: http
              containerPort: 8080
            - name: probes
              containerPort: 7070
            - name: https
              containerPort: 8443
          livenessProbe:
            httpGet:
              path: /health/live
              port: probes
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: probes
            periodSeconds: 5
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/url-shortener
              readOnly: true
            
            - name: identity
              mountPath: /var/run/identity
              readOnly: true
            
            - mountPath: /etc/url-shortener-pg-ca
              name: database-ca
              readOnly: true
            - mountPath: /etc/url-shortener-pg-password
              name: database-password
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: example-redirect-config
        
        - name: identity
          csi:
            driver: spiffe.csi.cert-manager.io
            readOnly: true
        
        - configMap:
            name: pg-ca
          name: database-ca
        - name: database-password
          secret:
            defaultMode: 288
            items:
            - key: password
              path: password
            secretName: app

