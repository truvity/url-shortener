# Source: url-shortener/templates/redirect.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-redirect
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/instance: example
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # The replacement is READY before the incumbent is touched.
      # The default is 25%, which on two replicas means one goes
      # away first.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener
      app.kubernetes.io/instance: example
      app.kubernetes.io/component: redirect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener
        app.kubernetes.io/instance: example
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.0.0"
        app.kubernetes.io/component: redirect
      annotations:
        # Restart on a configuration change. Without this a `helm upgrade`
        # that only edits the ConfigMap changes nothing at all: the pods keep
        # the file they started with, and the deploy reads as successful.
        checksum/config: c5e774e38d807866a179114e14a42235e6da5fe2b1a2761803032e4d65b58b8c
    spec:
      serviceAccountName: example-redirect
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: url-shortener
              app.kubernetes.io/instance: example
              app.kubernetes.io/component: redirect
      containers:
        - name: redirect
          image: ghcr.io/truvity/policy/url-shortener/redirect:0.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args: ["-config", "/etc/url-shortener/redirect.yaml"]
          env:
            - name: OTEL_SERVICE_NAME
              value: "example-redirect"
            - name: OTEL_TRACES_EXPORTER
              value: "none"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app
                  key: password
          ports:
            - name: http
              containerPort: 8080
            - name: probes
              containerPort: 7070
            
            - name: https
              containerPort: 8443
          livenessProbe:
            # Nothing but the process. A liveness probe that checks a
            # dependency restarts a healthy process and makes an outage worse.
            httpGet: { path: /health/live, port: probes }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: probes }
            periodSeconds: 5
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            
            - name: config
              mountPath: /etc/url-shortener
              readOnly: true
            
            - name: identity
              mountPath: /var/run/identity
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        
        - name: config
          configMap:
            name: example-config
        
        - name: identity
          csi:
            driver: spiffe.csi.cert-manager.io
            readOnly: true

