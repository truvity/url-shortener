        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.0.0"
        app.kubernetes.io/component: log
      annotations:
        # Restart on a configuration change. Without this a `helm upgrade`
        # that only edits the ConfigMap changes nothing at all: the pods keep
        # the file they started with, and the deploy reads as successful.
        checksum/config: 948a57d7a404375d31a29aad835e0eff8d09f0ae7f448f9acbcfa40dd05b518c
    spec:
      serviceAccountName: archiver
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: url-shortener
              app.kubernetes.io/instance: example
