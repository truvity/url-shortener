---
# Source: url-shortener-infra/templates/infra.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: example-pg
  labels:
    app.kubernetes.io/instance: example
    app.kubernetes.io/name: url-shortener-infra
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: url_shortener
      owner: url_shortener_owner
  managed:
    roles:
      - name: url_shortener_app
        ensure: present
        login: true
        connectionLimit: -1
        inherit: true
        passwordSecret:
          name: example-pg-runtime

---
# Source: url-shortener-infra/charts/cnpg-database/templates/roles.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: example-pg-runtime
  namespace: default
  labels:
    app.kubernetes.io/instance: example
    app.kubernetes.io/name: url-shortener-infra
spec:
  # Generated once and never refreshed: a refresh would mint a new password
  # and lock out every pod holding the old one.
  refreshInterval: "0"
  target:
    name: example-pg-runtime
    template:
      # basic-auth is what the operator reads a managed role's credential from.
      type: kubernetes.io/basic-auth
      data:
        username: "url_shortener_app"
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: example-pg-runtime

---
# Source: url-shortener-infra/charts/cnpg-database/templates/roles.yaml
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: example-pg-runtime
  namespace: default
  labels:
    app.kubernetes.io/instance: example
    app.kubernetes.io/name: url-shortener-infra
spec:
  length: 32
  digits: 5
  symbols: 0
  noUpper: false
  allowRepeat: true

---
# Source: url-shortener-infra/templates/infra.yaml
apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: example-events
  labels:
    app.kubernetes.io/name: url-shortener-infra
    app.kubernetes.io/instance: example
spec:
  name: default-example-events
  subjects:
    - "default-example.redirect"
    - "default-example.log"
  storage: memory
  replicas: 1
  servers:
    - nats://nats.nats.svc:4222
