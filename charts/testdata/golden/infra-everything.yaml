---
# Source: url-shortener-infra/templates/cloud.yaml
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: example-identity
  labels:
    app.kubernetes.io/name: url-shortener-infra
    app.kubernetes.io/instance: example
spec:
  name: example-identity
  description: "example: workload role for the application account"
  permissionsBoundary: "arn:aws:iam::example-account-id:policy/example-boundary"
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [{
        "Effect": "Allow",
        "Principal": {"Service": "pods.eks.amazonaws.com"},
        "Action": ["sts:AssumeRole", "sts:TagSession"],
        "Condition": {"StringEquals": {
          "aws:SourceAccount": "example-account-id",
          "aws:SourceArn": "arn:aws:eks:example-region:example-account-id:cluster/example-cluster",
          "aws:RequestTag/kubernetes-namespace": "default",
          "aws:RequestTag/kubernetes-service-account": "example-account"
        }}
      }]
    }
  tags:
    - key: cluster
      value: "example-cluster"
  policyRefs:
    - from:
        name: example-identity

---
# Source: url-shortener-infra/templates/cloud.yaml
apiVersion: networking.k8s.aws/v1alpha1
kind: ApplicationNetworkPolicy
metadata:
  name: example-store-egress
  labels:
    app.kubernetes.io/name: url-shortener-infra
    app.kubernetes.io/instance: example
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: example
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [log]
  policyTypes: [Egress]
  egress:
    - to:
        - domainNames: ["*.amazonaws.com"]
      ports:
        - port: 443
          protocol: TCP

---
# Source: url-shortener-infra/templates/cloud.yaml
apiVersion: s3.services.k8s.aws/v1alpha1
kind: Bucket
metadata:
  name: example-archive
  labels:
    app.kubernetes.io/name: url-shortener-infra
    app.kubernetes.io/instance: example
  annotations:
    services.k8s.aws/deletion-policy: retain
    services.k8s.aws/adoption-policy: adopt-or-create
    services.k8s.aws/adoption-fields: '{"name": "example-archive"}'
spec:
  name: example-archive
  tagging:
    tagSet:
      - key: tenancy.truvity.io/install
        value: example
      - key: truvity.io/preserve
        value: "true"

---
# Source: url-shortener-infra/templates/infra.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: example-pg
  labels:
    app.kubernetes.io/instance: example
    app.kubernetes.io/name: url-shortener-infra
    example.io/project: url-shortener
    example.io/tier: primary
spec:
  instances: 3
  storage:
    size: 20Gi
  bootstrap:
    initdb:
      database: shortener
      owner: shortener_owner
  affinity:
    nodeSelector:
      example.io/nodepool: durable
    tolerations:
      - effect: NoSchedule
        key: durable
        operator: Equal
        value: "true"
  certificates:
    serverTLSSecret: "url-shortener-pg-server"
    serverCASecret: "example-trust-bundle"
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: "example-archive"
        serverName: "url-shortener-pg-g2"
  managed:
    roles:
      - name: shortener_app
        ensure: present
        login: true
        connectionLimit: -1
        inherit: true
        passwordSecret:
          name: example-pg-runtime

---
# Source: url-shortener-infra/templates/cloud.yaml
apiVersion: eks.services.k8s.aws/v1alpha1
kind: PodIdentityAssociation
metadata:
  name: example-identity
  labels:
    app.kubernetes.io/name: url-shortener-infra
    app.kubernetes.io/instance: example
spec:
  clusterName: "example-cluster"
  namespace: "default"
  serviceAccount: "example-account"
  roleARN: "arn:aws:iam::example-account-id:role/example-identity"

---
# Source: url-shortener-infra/templates/cloud.yaml
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Policy
metadata:
  name: example-identity
  labels:
    app.kubernetes.io/name: url-shortener-infra
    app.kubernetes.io/instance: example
spec:
  name: example-identity
  description: "example: append-only on the archive store"
  policyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {"Effect": "Allow", "Action": ["s3:PutObject"], "Resource": "arn:aws:s3:::example-archive/*"},
        {"Effect": "Allow", "Action": ["s3:ListBucket"], "Resource": "arn:aws:s3:::example-archive"}
      ]
    }

---
# Source: url-shortener-infra/templates/infra.yaml
apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: example-events
  labels:
    app.kubernetes.io/name: url-shortener-infra
    app.kubernetes.io/instance: example
spec:
  name: default-example-install-events
  subjects:
    - "default-example-install.redirect"
    - "default-example-install.log"
  storage: file
  replicas: 3
  maxAge: "24h"
  account: "url-shortener"
