---
# Source: url-shortener-e2e/templates/prober.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-e2e-prober
  labels:
    app.kubernetes.io/name: url-shortener-e2e
    app.kubernetes.io/instance: example-e2e
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: prober
spec:
  replicas: 1
  # Recreate, not the RollingUpdate default: with one replica, a
  # maxUnavailable of 25% rounds down to 0, so RollingUpdate would leave the
  # OLD pod running — and producing synthetic traffic — for as long as the
  # new one fails to come up. That hides a broken prober from anything
  # reading its metrics as a monitoring gate. Recreate stops the old pod
  # first, so a bad rollout shows up as MISSING traffic instead. Not
  # configurable: this is the chart's own design choice for a single-replica
  # traffic generator, not something a deployment should be able to opt out
  # of.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener-e2e
      app.kubernetes.io/instance: example-e2e
      app.kubernetes.io/component: prober
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener-e2e
        app.kubernetes.io/instance: example-e2e
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: prober
      annotations:
        # Restart on a configuration change — the same rule
        # charts/url-shortener/templates/redirect.yaml states in full: without
        # this, a `helm upgrade` that only edits the ConfigMap changes
        # nothing, because the running pod keeps the file it started with.
        checksum/config: 121bfc46333467489f4c69149b7be69c8cbedd17d74981420e5e65d9f6c507e8
    spec:
      # Named only while the transport identity is on: the CSI driver
      # derives this pod's SPIFFE identity from the account it runs as, and
      # templates/prober-identity-rbac.yaml's Role/RoleBinding (when
      # tls.grantRequest) binds to this exact name. Left unset while
      # tls.mode is "off", so the default render is byte-identical to one
      # from a chart that had never heard of any of this.
      serviceAccountName: given-prober-account
      # No Kubernetes API access at all: this workload only ever speaks
      # HTTP to two Services, on the same terms as
      # examples/url-shortener/e2e/suite's own client calls — unlike the
      # e2e Job beside it (templates/rbac.yaml), there is nothing here for
      # a ServiceAccount token to be for. Still true above: the certificate
      # named by serviceAccountName arrives through the CSI driver's own
      # TokenRequest for this pod's account, a mechanism entirely separate
      # from this flag, which only governs the ordinary automounted token
      # this container never reads.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
      containers:
        - name: prober
          image: registry.example.test/url-shortener/prober:4.5.6
          imagePullPolicy: Always
          args: ["-config", "/etc/url-shortener/prober.yaml"]
          env:
            - name: OTEL_SERVICE_NAME
              value: "example-e2e-prober"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "https://otel.example.test"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_TRACES_SAMPLER
              value: "always_on"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: cluster=test-cluster,environment=test
          ports:
            - name: probes
              containerPort: 7070
          livenessProbe:
            # Nothing but the process — a liveness probe that checked a
            # journey's success would restart a healthy process the moment
            # its TARGET went down, which is the one time this workload is
            # doing its job.
            httpGet: { path: /health/live, port: probes }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: probes }
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/url-shortener
              readOnly: true
            
            - name: identity
              mountPath: /var/run/example-identity
              readOnly: true
          resources:
            limits:
              cpu: 40m
              memory: 96Mi
            requests:
              cpu: 20m
              memory: 48Mi
      volumes:
        - name: config
          configMap:
            name: example-e2e-prober
        
        - name: identity
          csi:
            driver: example.csi.invalid
            readOnly: true

---
# Source: url-shortener-e2e/templates/job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: example-e2e-0-0-0
  labels:
    app.kubernetes.io/name: url-shortener-e2e
    app.kubernetes.io/instance: example-e2e
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: e2e
  annotations:
    example.test/replace-strategy: force
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener-e2e
        app.kubernetes.io/instance: example-e2e
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: e2e
    spec:
      restartPolicy: Never
      serviceAccountName: given-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: e2e
          image: registry.example.test/url-shortener/e2e:1.2.3
          imagePullPolicy: Always
          args:
            - "-test.v"
            # See values.yaml's own comment on `mode` for why exactly this
            # one case is skipped and nothing else is.
            - "-test.skip=TestMigrationRanAndRolesAreSeparate"
          env:
            # The one variable that turns the suite on at all — see
            # e2e/suite/env_test.go's envNamespace doc comment.
            - name: E2E_NAMESPACE
              value: "default"
            - name: E2E_APP_RELEASE
              value: "example"
            # Set, and EMPTY: the suite's own kubecontextFromEnv treats a
            # present-but-empty value as "no --context at all", which is
            # what a Job running in the cluster it tests needs — kubectl
            # and the harness then fall back to this Pod's own
            # ServiceAccount rather than a kubeconfig context that does
            # not exist here. It is also what makes (*Cluster).ServiceURL
            # dial every Service's ClusterIP directly instead of opening a
            # port-forward — see templates/rbac.yaml's own comment on why
            # this Role grants no `pods/portforward`.
            - name: E2E_KCTX
              value: ""
            - name: E2E_NAMES_FROM_ENV
              value: "1"
            # This chart's OWN version — released under the SAME version as
            # the application chart it tests (see .github/workflows/
            # release.yaml's own comment on why the two, plus
            # url-shortener-infra, ship as one), so it is exactly what the
            # application release's own pods are stamped with (see
            # charts/url-shortener/templates/_helpers.tpl's
            # "url-shortener.labels"). The suite's own env_test.go and
            # readiness_test.go read it back to prove a test run is judging
            # the version THIS Job's release actually promoted, not merely
            # whatever generation happened to be live when this Job started
            # — see docs/guides/testing.md and e2e/suite/readiness_test.go's
            # waitForPromotedRollout for the race this closes.
            - name: E2E_APP_VERSION
              value: "0.0.0"
            - name: E2E_DATABASE
              value: "shortener_db"
            - name: E2E_DATABASE_HOST
              value: "pg.custom.svc"
            - name: E2E_OWNER_ROLE
              value: "shortener_owner"
            - name: E2E_APP_ROLE
              value: "shortener_app"
            - name: E2E_APP_SECRET
              value: "shortener-app-secret"
            # The runtime role's password ITSELF — resolved by the kubelet
            # at admission, never read back by this Pod's own
            # ServiceAccount token, which is why templates/rbac.yaml grants
            # this account nothing on Secrets at all.
            - name: E2E_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shortener-app-secret
                  key: pw
            - name: E2E_STREAM
              value: "custom-events"
            - name: E2E_REDIRECT_SUBJECT
              value: "custom.redirect"
            - name: E2E_REQUEST_SUBJECT
              value: "custom.log"
            - name: E2E_STAT_CONSUMER
              value: "custom-stat"
            - name: E2E_LOG_CONSUMER
              value: "custom-log"
            - name: E2E_BUCKET
              value: "custom-archive"
            - name: E2E_S3_REGION
              value: "eu-west-1"
            - name: E2E_S3_ENDPOINT
              value: "https://s3.example.test"
            # Static credentials for archive.endpoint, on exactly the same
            # terms as E2E_APP_PASSWORD above — a Secret this account has
            # no RBAC to read, resolved by the kubelet at admission
            # instead. See values.yaml's own comment on
            # archive.credentialsSecret for when this is needed at all.
            - name: E2E_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: custom-archive-creds
                  key: ak
            - name: E2E_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: custom-archive-creds
                  key: sk
            - name: E2E_TRACES_URL
              value: "https://jaeger.example.test"
            # RFC 8693 token exchange for traces.url — see
            # templates/_helpers.tpl's "url-shortener-e2e.tracesTokenVolume"
            # for the projected token this trades, and values.yaml's own
            # comment on traces.tokenExchange for what each field is.
            - name: E2E_TRACES_TOKEN_URL
              value: "https://issuer.example.test/token"
            - name: E2E_TRACES_CLIENT
              value: "trace-reader"
            - name: E2E_TRACES_TOKEN_FILE
              value: /var/run/traces/token
            - name: E2E_TRACES_CA_FILE
              value: /var/run/traces-ca/bundle.pem
            # The suite's own workload identity, for calls to `urls` and
            # `redirect` — see values.yaml's own comment on job.tls, and
            # e2e/tlsenv for what each variable means. Absent while
            # job.tls.enabled is false, so the default Job is unchanged.
            - name: E2E_URLS_TLS
              value: "strict"
            - name: E2E_REDIRECT_TLS
              value: "permissive"
            - name: E2E_TLS_PORT
              value: "9444"
            - name: E2E_TLS_DIR
              value: "/var/run/example-identity"
            - name: E2E_TLS_TRUST_DOMAIN
              value: "example.invalid"
            - name: E2E_TLS_PEERS
              value: "other/reader"
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: traces-token
              mountPath: /var/run/traces
              readOnly: true
            - name: traces-ca
              mountPath: /var/run/traces-ca
              readOnly: true
            - name: identity
              mountPath: /var/run/example-identity
              readOnly: true
      volumes:
        - name: traces-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "custom-issuer-audience"
                  expirationSeconds: 1800
                  path: token
        - name: traces-ca
          configMap:
            name: custom-traces-ca
        - name: identity
          csi:
            driver: example.csi.invalid
            readOnly: true
