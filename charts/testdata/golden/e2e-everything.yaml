---
# Source: url-shortener-e2e/templates/prober.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-e2e-prober
  labels:
    app.kubernetes.io/name: url-shortener-e2e
    app.kubernetes.io/instance: example-e2e
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: prober
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener-e2e
      app.kubernetes.io/instance: example-e2e
      app.kubernetes.io/component: prober
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener-e2e
        app.kubernetes.io/instance: example-e2e
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: prober
      annotations:
        # Restart on a configuration change — the same rule
        # charts/url-shortener/templates/redirect.yaml states in full: without
        # this, a `helm upgrade` that only edits the ConfigMap changes
        # nothing, because the running pod keeps the file it started with.
        checksum/config: be0bdb5ee113c2a096dbfd877fe09a0252db19eb066f87c98e2c549cf0698125
    spec:
      # No Kubernetes API access at all: this workload only ever speaks
      # HTTP to two Services, on the same terms as
      # examples/url-shortener/e2e/suite's own client calls — unlike the
      # e2e Job beside it (templates/rbac.yaml), there is nothing here for
      # a ServiceAccount token to be for.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
      containers:
        - name: prober
          image: registry.example.test/url-shortener/prober:4.5.6
          imagePullPolicy: Always
          args: ["-config", "/etc/url-shortener/prober.yaml"]
          env:
            - name: OTEL_SERVICE_NAME
              value: "example-e2e-prober"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "https://otel.example.test"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_TRACES_SAMPLER
              value: "always_on"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: cluster=test-cluster,environment=test
          ports:
            - name: probes
              containerPort: 7070
          livenessProbe:
            # Nothing but the process — a liveness probe that checked a
            # journey's success would restart a healthy process the moment
            # its TARGET went down, which is the one time this workload is
            # doing its job.
            httpGet: { path: /health/live, port: probes }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: probes }
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/url-shortener
              readOnly: true
          resources:
            limits:
              cpu: 40m
              memory: 96Mi
            requests:
              cpu: 20m
              memory: 48Mi
      volumes:
        - name: config
          configMap:
            name: example-e2e-prober

---
# Source: url-shortener-e2e/templates/job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: example-e2e-0-0-0
  labels:
    app.kubernetes.io/name: url-shortener-e2e
    app.kubernetes.io/instance: example-e2e
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: e2e
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener-e2e
        app.kubernetes.io/instance: example-e2e
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: e2e
    spec:
      restartPolicy: Never
      serviceAccountName: given-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: e2e
          image: registry.example.test/url-shortener/e2e:1.2.3
          imagePullPolicy: Always
          args:
            - "-test.v"
            # See values.yaml's own comment on `mode` for why exactly this
            # one case is skipped and nothing else is.
            - "-test.skip=TestMigrationRanAndRolesAreSeparate"
          env:
            # The one variable that turns the suite on at all — see
            # e2e/suite/env_test.go's envNamespace doc comment.
            - name: E2E_NAMESPACE
              value: "default"
            - name: E2E_APP_RELEASE
              value: "example"
            # Set, and EMPTY: the suite's own kubecontextFromEnv treats a
            # present-but-empty value as "no --context at all", which is
            # what a Job running in the cluster it tests needs — kubectl
            # and the harness then fall back to this Pod's own
            # ServiceAccount rather than a kubeconfig context that does
            # not exist here. It is also what makes (*Cluster).ServiceURL
            # dial every Service's ClusterIP directly instead of opening a
            # port-forward — see templates/rbac.yaml's own comment on why
            # this Role grants no `pods/portforward`.
            - name: E2E_KCTX
              value: ""
            - name: E2E_NAMES_FROM_ENV
              value: "1"
            - name: E2E_DATABASE
              value: "shortener_db"
            - name: E2E_DATABASE_HOST
              value: "pg.custom.svc"
            - name: E2E_OWNER_ROLE
              value: "shortener_owner"
            - name: E2E_APP_ROLE
              value: "shortener_app"
            - name: E2E_APP_SECRET
              value: "shortener-app-secret"
            # The runtime role's password ITSELF — resolved by the kubelet
            # at admission, never read back by this Pod's own
            # ServiceAccount token, which is why templates/rbac.yaml grants
            # this account nothing on Secrets at all.
            - name: E2E_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shortener-app-secret
                  key: pw
            - name: E2E_STREAM
              value: "custom-events"
            - name: E2E_REDIRECT_SUBJECT
              value: "custom.redirect"
            - name: E2E_REQUEST_SUBJECT
              value: "custom.log"
            - name: E2E_STAT_CONSUMER
              value: "custom-stat"
            - name: E2E_LOG_CONSUMER
              value: "custom-log"
            - name: E2E_BUCKET
              value: "custom-archive"
            - name: E2E_S3_REGION
              value: "eu-west-1"
            - name: E2E_S3_ENDPOINT
              value: "https://s3.example.test"
            # Static credentials for archive.endpoint, on exactly the same
            # terms as E2E_APP_PASSWORD above — a Secret this account has
            # no RBAC to read, resolved by the kubelet at admission
            # instead. See values.yaml's own comment on
            # archive.credentialsSecret for when this is needed at all.
            - name: E2E_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: custom-archive-creds
                  key: ak
            - name: E2E_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: custom-archive-creds
                  key: sk
            - name: E2E_TRACES_URL
              value: "https://jaeger.example.test"
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
