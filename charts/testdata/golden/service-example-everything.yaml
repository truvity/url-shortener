apiVersion: v1
kind: ServiceAccount
metadata:
  name: echo-account
  labels:
    app.kubernetes.io/name: service-example
    app.kubernetes.io/instance: r
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/component: echo
  annotations:
    "example.invalid/role": "echo"

---
# Source: service-example/templates/service.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: r-echo-config
  labels:
    app.kubernetes.io/name: service-example
    app.kubernetes.io/instance: r
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/component: echo
data:
  echo.yaml: |
    drain:
      seconds: 33
    greeting: hello everyone
    listen:
      address: :8081
    log:
      level: debug
    probes:
      address: :7071
    secrets:
      root: /var/run/secrets/echo
      source: file
    store:
      tokenSecret: store/token
    tls:
      address: :9443
      caFile: /var/run/example-identity/ca.crt
      certFile: /var/run/example-identity/tls.crt
      keyFile: /var/run/example-identity/tls.key
      mode: permissive
      peers:
      - namespace: other
        serviceAccount: caller
      trustDomain: example.invalid

