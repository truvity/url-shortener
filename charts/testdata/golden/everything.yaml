apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-stat
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/instance: example
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener
      app.kubernetes.io/instance: example
      app.kubernetes.io/component: stat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener
        app.kubernetes.io/instance: example
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.0.0"
        app.kubernetes.io/component: stat
      annotations:
        # Restart on a configuration change. Without this a `helm upgrade`
        # that only edits the ConfigMap changes nothing at all: the pods keep
        # the file they started with, and the deploy reads as successful.
        checksum/config: 47e01380a8812beefa72774fc5b371ca0be47edb0c50ec0202b9d1ae1a7b7ff1
    spec:
      serviceAccountName: example-stat
      securityContext:
        runAsNonRoot: true
        runAsUser: 1234
        runAsGroup: 5678
        fsGroup: 9012
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: url-shortener
              app.kubernetes.io/instance: example
              app.kubernetes.io/component: stat
      containers:
        - name: stat
          image: example.io/shortener/stat@sha256:4444444444444444444444444444444444444444444444444444444444444444
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args: ["-config", "/etc/url-shortener/stat.yaml"]
          env:
            - name: OTEL_SERVICE_NAME
              value: "example-stat"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://collector.example.invalid:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.25"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.example.tier=primary
            
          ports:
            
            - name: probes
              containerPort: 7070
          livenessProbe:
            httpGet:
              path: /health/live
              port: probes
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: probes
            periodSeconds: 5
          lifecycle:
            preStop:
              sleep:
                seconds: 7
          volumeMounts:
            - name: config
              mountPath: /etc/url-shortener
              readOnly: true
            
            - name: identity
              mountPath: /var/run/example-identity
              readOnly: true
          resources:
            requests:
              cpu: 22m
              memory: 222Mi
      volumes:
        - name: config
          configMap:
            name: example-stat-config
        
        - name: identity
          csi:
            driver: example.csi.invalid
            readOnly: true

