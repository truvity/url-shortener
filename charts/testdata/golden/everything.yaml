# Source: url-shortener/templates/route.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/instance: example
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
spec:
  parentRefs:
    - name: example-gateway
      namespace: gateways
      sectionName: https
  hostnames: ["shortener.example.invalid"]
  rules:
    
    - name: redirect
      matches:
        - path:
            type: PathPrefix
            value: /r/
      backendRefs:
        - group: ""
          kind: Service
          name: example-redirect
          port: 8080
          weight: 1
    - name: example-rule
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: example-web
          port: 8080
          weight: 1
