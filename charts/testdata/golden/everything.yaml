apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-redirect
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/instance: example
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener
      app.kubernetes.io/instance: example
      app.kubernetes.io/component: redirect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener
        app.kubernetes.io/instance: example
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.0.0"
        app.kubernetes.io/component: redirect
      annotations:
        # Restart on a configuration change. Without this a `helm upgrade`
        # that only edits the ConfigMap changes nothing at all: the pods keep
        # the file they started with, and the deploy reads as successful.
        checksum/config: 2e0e94cac37a9b8e110659b1516fb7298ce64ae5fffb8ca24a96a11b766d1757
    spec:
      serviceAccountName: example-redirect
      securityContext:
        runAsNonRoot: true
        runAsUser: 1234
        runAsGroup: 5678
        fsGroup: 9012
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: url-shortener
              app.kubernetes.io/instance: example
              app.kubernetes.io/component: redirect
      containers:
        - name: redirect
          image: example.io/shortener/redirect@sha256:2222222222222222222222222222222222222222222222222222222222222222
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args: ["-config", "/etc/url-shortener/redirect.yaml"]
          env:
            - name: OTEL_SERVICE_NAME
              value: "example-redirect"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://collector.example.invalid:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.25"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.example.tier=primary
            - name: PGHOST
              value: pg-rw.default.svc.cluster.example
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: shortener
            - name: PGUSER
              value: app_role
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /etc/url-shortener-pg-ca/root.pem
            - name: CNPG_CLIENT_PASSWORD_FILE
              value: /etc/url-shortener-pg-password/password
            - name: PGAPPNAME
              value: example-redirect
            - name: CNPG_CLIENT_POOL_MAX
              value: "10"
          ports:
            
            - name: http
              containerPort: 8080
            - name: probes
              containerPort: 7070
            - name: https
              containerPort: 9443
          livenessProbe:
            httpGet:
              path: /health/live
              port: probes
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: probes
            periodSeconds: 5
          lifecycle:
            preStop:
              sleep:
                seconds: 7
          volumeMounts:
            - name: config
              mountPath: /etc/url-shortener
              readOnly: true
            
            - name: identity
              mountPath: /var/run/example-identity
              readOnly: true
            
            - mountPath: /etc/url-shortener-pg-ca
              name: database-ca
              readOnly: true
            - mountPath: /etc/url-shortener-pg-password
              name: database-password
              readOnly: true
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 11m
              memory: 111Mi
      volumes:
        - name: config
          configMap:
            name: example-redirect-config
        
        - name: identity
          csi:
            driver: example.csi.invalid
            readOnly: true
        
        - configMap:
            name: example-root-ca
          name: database-ca
        - name: database-password
          secret:
            defaultMode: 288
            items:
            - key: app-key
              path: password
            secretName: app-secret

