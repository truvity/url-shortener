# Source: url-shortener/templates/prober-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-prober
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/instance: example
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/component: prober
data:
  prober.yaml: |
    probes:
      address: ":7070"
    log:
      level: "debug"
    drain:
      seconds: 3
    interval: "5s"
    keyPrefix: "synthetic-"
    statSettle: "30s"
    tls:
      mode: strict
      certFile: /var/run/example-identity/tls.crt
      keyFile: /var/run/example-identity/tls.key
      caFile: /var/run/example-identity/ca.crt
      trustDomain: example.invalid
      peers:
        - namespace: default
          serviceAccount: example-urls
        - namespace: default
          serviceAccount: example-redirect
    urls:
      address: https://example-urls:8080
    redirect:
      address: https://example-redirect:9443

