data:
  web.yaml: |
    assets:
      directory: /app/assets
    csp:
      connectSrc:
      - https://collector.example
      mode: enforce
      reportUri: /csp-report
    drain:
      seconds: 33
    faro:
      apiKey: public-app-key
      appName: example-web
      collectorUrl: https://collector.example/collect
      enabled: true
      environment: example
      sampleRate: 0.25
    listen:
      address: :8080
    log:
      level: debug
    probes:
      address: :7070
    tls:
      caFile: /var/run/example-identity/ca.crt
