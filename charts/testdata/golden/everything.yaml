                seconds: 7
          volumeMounts:
            
            - name: config
              mountPath: /etc/url-shortener
              readOnly: true
            
            - name: identity
              mountPath: /var/run/example-identity
              readOnly: true
          resources:
            requests:
              cpu: 33m
              memory: 333Mi
      volumes:
        
        - name: config
          configMap:
            name: example-config
        
        - name: identity
          csi:
            driver: example.csi.invalid
            readOnly: true

