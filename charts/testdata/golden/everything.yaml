# Source: url-shortener/templates/redirect.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-redirect
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/instance: example
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # The replacement is READY before the incumbent is touched.
      # The default is 25%, which on two replicas means one goes
      # away first.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener
      app.kubernetes.io/instance: example
      app.kubernetes.io/component: redirect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener
        app.kubernetes.io/instance: example
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: redirect
      annotations:
        # Restart on a configuration change. Without this a `helm upgrade`
        # that only edits the ConfigMap changes nothing at all: the pods keep
        # the file they started with, and the deploy reads as successful.
        checksum/config: 784d8f0d9dbf53a0dc4611b69415a26e6cd826e0691b4e4978dc88aa0e04b87e
    spec:
      serviceAccountName: app-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1234
        runAsGroup: 5678
        fsGroup: 9012
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: url-shortener
              app.kubernetes.io/instance: example
              app.kubernetes.io/component: redirect
      containers:
        - name: redirect
          image: example.io/shortener/redirect@sha256:2222222222222222222222222222222222222222222222222222222222222222
          imagePullPolicy: Always
          args: ["-config", "/etc/url-shortener/redirect.yaml"]
          env:
            - name: OTEL_SERVICE_NAME
              value: "example-redirect"
            - name: OTEL_TRACES_EXPORTER
              value: "none"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: app-key
          ports:
            - name: http
              containerPort: 8080
            - name: probes
              containerPort: 7070
            
            - name: https
              containerPort: 9443
          livenessProbe:
            # Nothing but the process. A liveness probe that checks a
            # dependency restarts a healthy process and makes an outage worse.
            httpGet: { path: /health/live, port: probes }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: probes }
            periodSeconds: 5
          lifecycle:
            preStop:
              sleep:
                seconds: 7
          volumeMounts:
            
            - name: config
              mountPath: /etc/url-shortener
              readOnly: true
            
            - name: identity
              mountPath: /var/run/example-identity
              readOnly: true
          resources:
            requests:
              cpu: 11m
              memory: 111Mi
      volumes:
        
        - name: config
          configMap:
            name: example-config
        
        - name: identity
          csi:
            driver: example.csi.invalid
            readOnly: true

