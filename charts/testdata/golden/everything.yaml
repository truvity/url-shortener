    metadata:
      labels:
        app.kubernetes.io/name: url-shortener
        app.kubernetes.io/instance: example
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: log
      annotations:
        checksum/config: 784d8f0d9dbf53a0dc4611b69415a26e6cd826e0691b4e4978dc88aa0e04b87e
    spec:
      serviceAccountName: app-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1234
        runAsGroup: 5678
        fsGroup: 9012
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: url-shortener
              app.kubernetes.io/instance: example
              app.kubernetes.io/component: log
      containers:
        - name: log
          image: example.io/shortener/log@sha256:5555555555555555555555555555555555555555555555555555555555555555
          imagePullPolicy: Always
          args: ["-config", "/etc/url-shortener/log.yaml"]
          env:
            - name: OTEL_SERVICE_NAME
              value: "example-log"
            - name: OTEL_TRACES_EXPORTER
              value: "none"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # The NAMES are in the configuration file; the values are here,
            # from a Secret, and appear in nothing that is rendered, printed
            # or committed.
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: archive-secret
                  key: id-key
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: archive-secret
                  key: secret-key
          ports:
            - name: probes
              containerPort: 7070
          livenessProbe:
            httpGet: { path: /health/live, port: probes }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: probes }
            periodSeconds: 5
          lifecycle:
            preStop:
