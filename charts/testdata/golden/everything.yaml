# Source: url-shortener/templates/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-config
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/instance: example
    app.kubernetes.io/managed-by: Helm
data:
  redirect.yaml: |
    listen:
      address: ":8080"
    probes:
      address: ":7070"
    log:
      level: debug
    drain:
      seconds: 33
    tls:
      mode: permissive
      address: ":9443"
      certFile: /var/run/example-identity/tls.crt
      keyFile: /var/run/example-identity/tls.key
      caFile: /var/run/example-identity/ca.crt
      trustDomain: example.invalid
      peers:
        - namespace: other
          serviceAccount: caller
    database:
      url: postgres://app_role@pg.example.svc:5432/shortener?sslmode=require
      passwordEnv: DATABASE_PASSWORD
      maxConnections: 10
    events:
      nats:
        url: nats://broker.example.svc:4222
      redirectSubject: example.redirect
      requestSubject: example.log

  urls.yaml: |
    listen:
      address: ":8080"
    probes:
      address: ":7070"
    log:
      level: debug
    drain:
      seconds: 33
    tls:
      mode: permissive
      address: ":9443"
      certFile: /var/run/example-identity/tls.crt
      keyFile: /var/run/example-identity/tls.key
      caFile: /var/run/example-identity/ca.crt
      trustDomain: example.invalid
      peers:
        - namespace: default
          serviceAccount: app-account
        - namespace: other
          serviceAccount: reader
    database:
      url: postgres://app_role@pg.example.svc:5432/shortener?sslmode=require
      passwordEnv: DATABASE_PASSWORD
      maxConnections: 20

  stat.yaml: |
    probes:
      address: ":7070"
    log:
      level: debug
    drain:
      seconds: 33
    tls:
      mode: strict
      certFile: /var/run/example-identity/tls.crt
      keyFile: /var/run/example-identity/tls.key
      caFile: /var/run/example-identity/ca.crt
      trustDomain: example.invalid
      peers:
        - namespace: default
          serviceAccount: app-account
    urls:
      address: https://example-urls:9443
    events:
      nats:
        url: nats://broker.example.svc:4222
      consumer:
        stream: EXAMPLE
        durable: example-stat
        subject: example.redirect

  web.yaml: |
    listen:
      address: ":8080"
    probes:
      address: ":7070"
    log:
      level: debug
    drain:
      seconds: 33
    tls:
      mode: strict
      certFile: /var/run/example-identity/tls.crt
      keyFile: /var/run/example-identity/tls.key
      caFile: /var/run/example-identity/ca.crt
      trustDomain: example.invalid
      peers:
        - namespace: default
          serviceAccount: app-account
    urls:
      address: https://example-urls:9443
    assets:
      directory: /app/assets

  log.yaml: |
    probes:
      address: ":7070"
    log:
      level: debug
    drain:
      seconds: 33
    events:
      nats:
        url: nats://broker.example.svc:4222
      consumer:
        stream: EXAMPLE
        durable: example-log
        subject: example.log
    archive:
      bucket:
        name: example-archive
        region: eu-west-1
        endpoint: https://s3.example.invalid
        ca: /var/run/store/ca.crt
        pathStyle: true
        credentialsEnv:
          accessKeyID: S3_ACCESS_KEY_ID
          secretAccessKey: S3_SECRET_ACCESS_KEY
      prefix: example/requests
      batch:
        maxRecords: 7
        maxSeconds: 11

