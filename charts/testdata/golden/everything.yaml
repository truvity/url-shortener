            value: /r/
      backendRefs:
        - group: ""
          kind: Service
          name: example-redirect
          port: 8080
          weight: 1
    - name: example-rule
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: example-web
          port: 8080
          weight: 1
