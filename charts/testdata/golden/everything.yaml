# Source: url-shortener/templates/migrate.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: example-migrate
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/instance: example
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener
        app.kubernetes.io/instance: example
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.0.0"
    spec:
      restartPolicy: Never
      serviceAccountName: migrate-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1234
        runAsGroup: 5678
        fsGroup: 9012
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: example.io/shortener/migrate@sha256:1111111111111111111111111111111111111111111111111111111111111111
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args: ["-config", "/etc/url-shortener/migrate.yaml"]
          env:
            - name: OTEL_SERVICE_NAME
              value: "example-migrate"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://collector.example.invalid:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.25"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.example.tier=primary
            - name: PGHOST
              value: "pg-rw.default.svc.cluster.example"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: "shortener"
            - name: PGUSER
              value: "owner_role"
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /etc/url-shortener-pg-ca/root.pem
            - name: CNPG_CLIENT_PASSWORD_FILE
              value: /etc/url-shortener-pg-password/password
            - name: PGAPPNAME
              value: "example-migrate"
            - name: CNPG_CLIENT_STATEMENT_TIMEOUT
              value: "10m"
          volumeMounts:
            - name: database-ca
              mountPath: /etc/url-shortener-pg-ca
              readOnly: true
            - name: database-password
              mountPath: /etc/url-shortener-pg-password
              readOnly: true
            - name: config
              mountPath: /etc/url-shortener
              readOnly: true
          resources:
            requests:
              cpu: 66m
              memory: 666Mi
      volumes:
        - name: database-ca
          configMap:
            name: example-root-ca
        - name: database-password
          secret:
            secretName: owner-secret
            defaultMode: 0440
            items:
              - key: owner-key
                path: password
        - name: config
          configMap:
            name: example-migrate-config

