---
# Source: url-shortener/templates/redirect.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-redirect
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/instance: example
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # The replacement is READY before the incumbent is touched.
      # The default is 25%, which on two replicas means one goes
      # away first.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener
      app.kubernetes.io/instance: example
      app.kubernetes.io/component: redirect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener
        app.kubernetes.io/instance: example
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: redirect
      annotations:
        # Restart on a configuration change. Without this a `helm upgrade`
        # that only edits the ConfigMap changes nothing at all: the pods keep
        # the file they started with, and the deploy reads as successful.
        checksum/config: 80c51cb2881b7a309b540d2805305ae238f1281513ede6ec66128a5d47bebdde
    spec:
      serviceAccountName: example-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: url-shortener
              app.kubernetes.io/instance: example
              app.kubernetes.io/component: redirect
      containers:
        - name: redirect
          image: ghcr.io/truvity/policy/url-shortener/redirect:0.0.0
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/url-shortener/redirect.yaml"]
          env:
            - name: OTEL_SERVICE_NAME
              value: "example-redirect"
            - name: OTEL_TRACES_EXPORTER
              value: "none"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app
                  key: password
          ports:
            - name: http
              containerPort: 8080
            - name: probes
              containerPort: 7070
          livenessProbe:
            # Nothing but the process. A liveness probe that checks a
            # dependency restarts a healthy process and makes an outage worse.
            httpGet: { path: /health/live, port: probes }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: probes }
            periodSeconds: 5
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            
            - name: config
              mountPath: /etc/url-shortener
              readOnly: true
            
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        
        - name: config
          configMap:
            name: example-config
        

