# Source: url-shortener/templates/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-config
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/instance: example
    app.kubernetes.io/managed-by: Helm
data:
  redirect.yaml: |
    listen:
      address: ":8080"
    probes:
      address: ":7070"
    log:
      level: info
    drain:
      seconds: 20
    database:
      url: postgres://url_shortener_app@pg:5432/url_shortener?sslmode=require
      passwordEnv: DATABASE_PASSWORD
      maxConnections: 10
    events:
      nats:
        url: nats://nats:4222
      redirectSubject: default-example.redirect
      requestSubject: default-example.log

  urls.yaml: |
    listen:
      address: ":8080"
    probes:
      address: ":7070"
    log:
      level: info
    drain:
      seconds: 20
    database:
      url: postgres://url_shortener_app@pg:5432/url_shortener?sslmode=require
      passwordEnv: DATABASE_PASSWORD
      maxConnections: 20

  stat.yaml: |
    probes:
      address: ":7070"
    log:
      level: info
    drain:
      seconds: 20
    urls:
      address: http://example-urls:8080
    events:
      nats:
        url: nats://nats:4222
      consumer:
        stream: default-example-events
        durable: default-example-stat
        subject: default-example.redirect

  web.yaml: |
    listen:
      address: ":8080"
    probes:
      address: ":7070"
    log:
      level: info
    drain:
      seconds: 20
    urls:
      address: http://example-urls:8080
    assets:
      directory: /app/assets

  log.yaml: |
    probes:
      address: ":7070"
    log:
      level: info
    drain:
      seconds: 20
    events:
      nats:
        url: nats://nats:4222
      consumer:
        stream: default-example-events
        durable: default-example-log
        subject: default-example.log
    archive:
      bucket:
        name: archive
      prefix: url-shortener/requests
      batch:
        maxRecords: 500
        maxSeconds: 60

