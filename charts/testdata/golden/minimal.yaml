---
# Source: url-shortener/templates/migrate.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: example-migrate
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/instance: example
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener
        app.kubernetes.io/instance: example
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.0.0"
    spec:
      restartPolicy: Never
      serviceAccountName: example-migrate
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/truvity/policy/url-shortener/migrate:0.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args: ["-config", "/etc/url-shortener/migrate.yaml"]
          env:
            - name: OTEL_SERVICE_NAME
              value: "example-migrate"
            - name: OTEL_TRACES_EXPORTER
              value: "none"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: PGHOST
              value: "pg.default.svc.cluster.example"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: "url_shortener"
            - name: PGUSER
              value: "url_shortener_owner"
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /etc/url-shortener-pg-ca/ca-certificates.crt
            - name: CNPG_CLIENT_PASSWORD_FILE
              value: /etc/url-shortener-pg-password/password
            - name: PGAPPNAME
              value: "example-migrate"
            - name: CNPG_CLIENT_STATEMENT_TIMEOUT
              value: "10m"
          volumeMounts:
            - name: database-ca
              mountPath: /etc/url-shortener-pg-ca
              readOnly: true
            - name: database-password
              mountPath: /etc/url-shortener-pg-password
              readOnly: true
            - name: config
              mountPath: /etc/url-shortener
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: database-ca
          configMap:
            name: pg-ca
        - name: database-password
          secret:
            secretName: owner
            defaultMode: 0440
            items:
              - key: password
                path: password
        - name: config
          configMap:
            name: example-migrate-config

