# Source: url-shortener/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: example-migrate
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/instance: example
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    # Before the migration's own configuration at -5, and well before the
    # Job at 0.
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation

---
# Source: url-shortener/templates/migrate-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-migrate-config
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/instance: example
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  migrate.yaml: |
    log:
      level: info
    database:
      url: postgres://url_shortener_owner@pg:5432/url_shortener?sslmode=require
      passwordEnv: DATABASE_PASSWORD
    ownerRole: url_shortener_owner
    appRole: url_shortener_app

---
# Source: url-shortener/templates/migrate.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: example-migrate
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/instance: example
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener
        app.kubernetes.io/instance: example
        app.kubernetes.io/managed-by: Helm
    spec:
      restartPolicy: Never
      serviceAccountName: example-migrate
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: migrate
          image: ghcr.io/truvity/policy/url-shortener/migrate:0.0.0
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/url-shortener/migrate.yaml"]
          env:
            - name: OTEL_SERVICE_NAME
              value: "example-migrate"
            - name: OTEL_TRACES_EXPORTER
              value: "none"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: owner
                  key: password
          volumeMounts:
            - name: config
              mountPath: /etc/url-shortener
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: example-migrate-config

