            - name: probes
              containerPort: 7070
          livenessProbe:
            httpGet:
              path: /health/live
              port: probes
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: probes
            periodSeconds: 5
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/url-shortener
              readOnly: true
            
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: example-log-config
