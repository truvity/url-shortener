apiVersion: v2
name: service-example
description: >-
  The smallest chart that follows the library convention: ONE service,
  rendered by service-lib from `platform` and `config` and nothing else. The
  chart guide (docs/guides/charts.md) walks through it, and the library's own
  tests render it.
type: application
version: 0.0.0
appVersion: "0.0.0"
# Resolved like any chart's, from the committed Chart.lock: the library as truvity/policy
# published it, at the version go.mod pins for the Go module.
dependencies:
  - name: service-lib
    version: 1.54.2
    repository: oci://ghcr.io/truvity/charts
