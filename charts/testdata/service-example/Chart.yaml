apiVersion: v2
name: service-example
description: >-
  The smallest chart that follows the library convention: ONE service,
  rendered by service-lib from `platform` and `config` and nothing else. The
  chart guide (docs/guides/charts.md) walks through it, and the library's own
  tests render it.
type: application
version: 0.0.0
appVersion: "0.0.0"
# Resolved like any chart's: the tests lay the library out beside it at the
# repository's own relative path and run `helm dependency build`.
dependencies:
  - name: service-lib
    version: 0.0.0
    repository: file://../../../../../charts/service-lib
