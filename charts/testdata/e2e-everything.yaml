# Every value set to something other than its default, so a template that
# stopped reading one shows up as a diff in the golden beside this.
appRelease: example
mode: tenant
database:
  host: pg.custom.svc
  name: shortener_db
  owner:
    role: shortener_owner
  app:
    role: shortener_app
    passwordSecret: shortener-app-secret
    passwordKey: pw
events:
  stream: custom-events
  redirectSubject: custom.redirect
  requestSubject: custom.log
  statConsumer: custom-stat
  logConsumer: custom-log
archive:
  bucket: custom-archive
  region: eu-west-1
  endpoint: https://s3.example.test
  credentialsSecret: custom-archive-creds
  accessKeyIDKey: ak
  secretAccessKeyKey: sk
traces:
  url: https://jaeger.example.test
  tokenExchange:
    tokenURL: https://issuer.example.test/token
    client: trace-reader
    audience: custom-issuer-audience
    expirationSeconds: 1800
  caConfigMap: custom-traces-ca
  caConfigMapKey: bundle.pem
images:
  e2e:
    registry: registry.example.test
    repository: url-shortener/e2e
    tag: "1.2.3"
    digest: ""
  prober:
    registry: registry.example.test
    repository: url-shortener/prober
    tag: "4.5.6"
    digest: ""
pullPolicy: Always
job:
  ttlSecondsAfterFinished: 900
  backoffLimit: 2
  activeDeadlineSeconds: 600
  annotations:
    example.test/replace-strategy: force
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 200m, memory: 256Mi }
serviceAccount:
  create: false
  name: given-account
podSecurity:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
prober:
  enabled: true
  interval: 5s
  keyPrefix: "synthetic-"
  pullPolicy: Always
  resources:
    requests: { cpu: 20m, memory: 48Mi }
    limits: { cpu: 40m, memory: 96Mi }
  log:
    level: debug
  drain:
    seconds: 3
  podSecurity:
    runAsUser: 2000
    runAsGroup: 2000
    fsGroup: 2000
  serviceAccount:
    create: false
    name: given-prober-account
tls:
  mode: permissive
  trustDomain: example.invalid
  csiDriver: example.csi.invalid
  mountPath: /var/run/example-identity
  grantRequest: false
  port: 9444
  peers:
    - namespace: other
      serviceAccount: reader
otel:
  endpoint: https://otel.example.test
  protocol: grpc
  tracesSampler: always_on
  sampleRatio: "1"
  resourceAttributes:
    cluster: test-cluster
    environment: test
