# The least a deployment can say: the things the chart refuses to guess.
#
# Everything else is a default, and the golden beside this is what those
# defaults render to — so a changed default is a diff in a review rather
# than a surprise in a cluster.
appRelease: example
database:
  host: example-pg-rw
  name: url_shortener
  owner:
    role: url_shortener_owner
  app:
    role: url_shortener_app
    passwordSecret: example-pg-runtime
events:
  stream: shortener-example-events
  redirectSubject: shortener-example.redirect
  requestSubject: shortener-example.log
  statConsumer: shortener-example-stat
  logConsumer: shortener-example-log
archive:
  bucket: url-shortener-archive
images:
  e2e:
    digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
