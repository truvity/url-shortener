# This chart renders its own database, and mints the runtime role's password
# itself: the Cluster declares the managed role, so cnpg-database renders only
# the Password generator and the ExternalSecret (`databaseRole: false`). The
# release is `example`.
postgres:
  runtimePasswordSecret: example-pg-runtime
  runtimePassword:
    generate: true
cnpg-database:
  roles:
    - name: url_shortener_app
      databaseRole: false
      labels:
        app.kubernetes.io/name: url-shortener-infra
        app.kubernetes.io/instance: example
      generatedPassword:
        secretName: example-pg-runtime
        length: 32
