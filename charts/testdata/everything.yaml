# One value set to something other than its default, so that a render which
# silently stopped reading a key shows up as a diff rather than as a
# deployment quietly running on a default nobody chose.
#
# This is the half of golden testing that earns its keep. A `minimal` render
# proves the chart works; this proves the chart is still WIRED — every value
# below has to appear somewhere in the output, and a template that dropped
# one would otherwise pass every test in this package.
installName: example-install

database:
  host: pg.example.svc
  name: shortener
  owner:
    role: owner_role
    passwordSecret: owner-secret
    passwordKey: owner-key
  app:
    role: app_role
    passwordSecret: app-secret
    passwordKey: app-key

events:
  url: nats://broker.example.svc:4222

archive:
  bucket:
    name: example-archive
    region: eu-west-1
    endpoint: https://s3.example.invalid
    ca: /var/run/store/ca.crt
    pathStyle: true
    credentialsSecret: archive-secret
    accessKeyIDKey: id-key
    secretAccessKeyKey: secret-key
  prefix: example/requests
  batch:
    maxRecords: 7
    maxSeconds: 11

images:
  migrate: {registry: example.io, repository: shortener/migrate, tag: "9.9.9", digest: "sha256:1111111111111111111111111111111111111111111111111111111111111111"}
  redirect: {registry: example.io, repository: shortener/redirect, tag: "9.9.9", digest: "sha256:2222222222222222222222222222222222222222222222222222222222222222"}
  urls: {registry: example.io, repository: shortener/urls, tag: "9.9.9", digest: "sha256:3333333333333333333333333333333333333333333333333333333333333333"}
  stat: {registry: example.io, repository: shortener/stat, tag: "9.9.9", digest: "sha256:4444444444444444444444444444444444444444444444444444444444444444"}
  log: {registry: example.io, repository: shortener/log, tag: "9.9.9", digest: "sha256:5555555555555555555555555555555555555555555555555555555555555555"}
  web: {registry: example.io, repository: shortener/web, tag: "9.9.9", digest: "sha256:6666666666666666666666666666666666666666666666666666666666666666"}
pullPolicy: Always
log:
  level: debug

serviceAccount:
  create: true
  app:
    name: app-account
    annotations:
      example.invalid/role: app
  migrate:
    name: migrate-account
    annotations:
      example.invalid/role: migrate

drain:
  seconds: 33
  preStopSeconds: 7

podSecurity:
  runAsUser: 1234
  runAsGroup: 5678
  fsGroup: 9012

tls:
  mode: permissive
  trustDomain: example.invalid
  csiDriver: example.csi.invalid
  mountPath: /var/run/example-identity
  grantRequest: true
  port: 9443
  peers:
    redirect:
      - namespace: other
        serviceAccount: caller
    urls:
      - namespace: other
        serviceAccount: reader

replicas:
  redirect: 3
  stat: 4
  log: 5
  urls: 6
  web: 7

disruption:
  enabled: true
  maxUnavailable: 2

resources:
  redirect:
    requests: { cpu: 11m, memory: 111Mi }
  stat:
    requests: { cpu: 22m, memory: 222Mi }
  log:
    requests: { cpu: 33m, memory: 333Mi }
  urls:
    requests: { cpu: 44m, memory: 444Mi }
  web:
    requests: { cpu: 55m, memory: 555Mi }
  migrate:
    requests: { cpu: 66m, memory: 666Mi }

route:
  enabled: true
  ruleName: example-rule
  parentRef:
    name: example-gateway
    namespace: gateways
    sectionName: https
  hostname: shortener.example.invalid

otel:
  endpoint: http://collector.example.invalid:4318
  protocol: http/protobuf
  tracesSampler: parentbased_traceidratio
  sampleRatio: "0.25"
  resourceAttributes:
    deployment.example.tier: primary
