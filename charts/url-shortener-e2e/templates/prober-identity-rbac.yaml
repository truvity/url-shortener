{{/*
The prober's own account, and permission for it to ASK for its own
identity — the SAME rule charts/url-shortener/templates/identity-rbac.yaml
states for the application's own workloads: the request is made AS the
prober's own account (that IS what makes the identity attested rather than
claimed), so that account needs whatever creating a CertificateRequest
takes. Without it the POD IS NEVER CREATED, and the reason ("error looking
up service account", or a forbidden request in the driver's log) lands in
an event nobody is watching while the Deployment sits waiting.

A separate file from rbac.yaml on purpose: that one is the e2e Job's own
Kubernetes API access (get/list/watch on Pods, Services, Deployments...),
and this is the prober's — two different workloads, two different grants,
and nothing here should have to change when the Job's RBAC does or the
other way around.

Everything below is rendered only while the prober is enabled AND its
transport identity is on: a chart installed with either left at its
default must carry no trace of a capability it never uses — see
chart_test.go's TestProberTransportOffLeavesNoTrace.
*/}}
{{- if and .Values.prober.enabled (include "url-shortener-e2e.tlsOn" .) }}
{{- if .Values.prober.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "url-shortener-e2e.proberServiceAccountName" . }}
  labels:
    {{- include "url-shortener-e2e.labels" . | nindent 4 }}
    app.kubernetes.io/component: prober
{{- end }}
{{- if .Values.tls.grantRequest }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "url-shortener-e2e.proberName" . }}-request-identity
  labels:
    {{- include "url-shortener-e2e.labels" . | nindent 4 }}
    app.kubernetes.io/component: prober
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "url-shortener-e2e.proberName" . }}-request-identity
  labels:
    {{- include "url-shortener-e2e.labels" . | nindent 4 }}
    app.kubernetes.io/component: prober
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "url-shortener-e2e.proberName" . }}-request-identity
subjects:
  - kind: ServiceAccount
    name: {{ include "url-shortener-e2e.proberServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
