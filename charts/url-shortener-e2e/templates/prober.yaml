{{/*
Always-on synthetic traffic (docs/guides/testing.md): a Deployment of ONE
replica running examples/url-shortener/e2e/cmd/prober against the release
named by .Values.appRelease — the SAME two Services the e2e Job's own
suite calls (charts/url-shortener/templates/{urls,redirect}.yaml). See
templates/prober-config.yaml for the file this Deployment mounts and how
it addresses them.

A Deployment, not a Job or a hook: this workload is meant to keep running
for the life of the release, which is the opposite of what either of those
is for. Off by default (.Values.prober.enabled) — see values.yaml's own
comment on why.
*/}}
{{- if .Values.prober.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "url-shortener-e2e.proberName" . }}
  labels:
    {{- include "url-shortener-e2e.labels" . | nindent 4 }}
    app.kubernetes.io/component: prober
spec:
  replicas: 1
  # Recreate, not the RollingUpdate default: with one replica, a
  # maxUnavailable of 25% rounds down to 0, so RollingUpdate would leave the
  # OLD pod running — and producing synthetic traffic — for as long as the
  # new one fails to come up. That hides a broken prober from anything
  # reading its metrics as a monitoring gate. Recreate stops the old pod
  # first, so a bad rollout shows up as MISSING traffic instead. Not
  # configurable: this is the chart's own design choice for a single-replica
  # traffic generator, not something a deployment should be able to opt out
  # of.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener-e2e
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: prober
  template:
    metadata:
      labels:
        {{- include "url-shortener-e2e.labels" . | nindent 8 }}
        app.kubernetes.io/component: prober
      annotations:
        # Restart on a configuration change — the same rule
        # charts/service-lib/templates/_workload.tpl states in full: without
        # this, a `helm upgrade` that only edits the ConfigMap changes
        # nothing, because the running pod keeps the file it started with.
        checksum/config: {{ include (print $.Template.BasePath "/prober-config.yaml") . | sha256sum }}
    spec:
      {{- if include "url-shortener-e2e.tlsOn" . }}
      # Named only while the transport identity is on: the CSI driver
      # derives this pod's SPIFFE identity from the account it runs as, and
      # templates/prober-identity-rbac.yaml's Role/RoleBinding (when
      # tls.grantRequest) binds to this exact name. Left unset while
      # tls.mode is "off", so the default render is byte-identical to one
      # from a chart that had never heard of any of this.
      serviceAccountName: {{ include "url-shortener-e2e.proberServiceAccountName" . }}
      {{- end }}
      # No Kubernetes API access at all: this workload only ever speaks
      # HTTP to two Services, on the same terms as
      # examples/url-shortener/e2e/suite's own client calls — unlike the
      # e2e Job beside it (templates/rbac.yaml), there is nothing here for
      # a ServiceAccount token to be for. Still true above: the certificate
      # named by serviceAccountName arrives through the CSI driver's own
      # TokenRequest for this pod's account, a mechanism entirely separate
      # from this flag, which only governs the ordinary automounted token
      # this container never reads.
      automountServiceAccountToken: false
      {{- include "url-shortener-e2e.proberPodSecurity" . | nindent 6 }}
      containers:
        - name: prober
          image: {{ include "url-shortener-e2e.proberImage" . }}
          imagePullPolicy: {{ .Values.prober.pullPolicy | default "IfNotPresent" }}
          {{- include "url-shortener-e2e.containerSecurity" . | nindent 10 }}
          args: ["-config", "/etc/url-shortener/prober.yaml"]
          env:
            {{- include "url-shortener-e2e.telemetryEnv" . | nindent 12 }}
          ports:
            - name: probes
              containerPort: 7070
          livenessProbe:
            # Nothing but the process — a liveness probe that checked a
            # journey's success would restart a healthy process the moment
            # its TARGET went down, which is the one time this workload is
            # doing its job.
            httpGet: { path: /health/live, port: probes }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: probes }
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/url-shortener
              readOnly: true
            {{- include "url-shortener-e2e.identityMount" . | nindent 12 }}
          resources: {{- toYaml .Values.prober.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "url-shortener-e2e.proberName" . }}
        {{- include "url-shortener-e2e.identityVolume" . | nindent 8 }}
{{- end }}
