# A Job that runs examples/url-shortener/e2e/suite INSIDE the cluster,
# against an application release already installed in the SAME namespace —
# see docs/guides/testing.md for how this differs from running the suite
# directly (`just example-smoke`) and from the application chart's own
# post-install hook (charts/url-shortener/templates/verification.yaml,
# which this chart does not replace — see its own doc comment for why that
# stays a hook while this is a plain Job).
#
# Every name below is a value rather than something this chart derives,
# because it is testing SOMEBODY ELSE's release: url-shortener-infra
# computes its stream, subjects and consumer names from a formula over its
# OWN release name, and this chart has no release of that infrastructure
# to render or to be the same release as. The suite itself never renders a
# chart to learn them (e2e/suite/fixture.Resolve needs `helm`, which is
# absent from the e2e image — the same reason
# charts/url-shortener/templates/verification.yaml's hook Job cannot use
# it either); it reads them from its own environment, which is exactly
# what this chart's templates/job.yaml fills in from the values below.

# The release under test, in THIS namespace. Required: there is no sane
# default for whose release this Job verifies.
appRelease: ""

# full | tenant.
#
#   full    runs every case the suite carries.
#   tenant  skips TestMigrationRanAndRolesAreSeparate, the one case that
#           issues DDL straight at the database (CREATE TABLE, then DROP
#           TABLE, to prove the runtime role cannot) — a probing write
#           that assumes this install owns its database outright. A
#           tenant sharing a database under a prefix (url-shortener-infra's
#           `tier: test`) does not, and should not be handed rights to
#           make that assumption true.
#
# Every other case is an ordinary application-level exercise — an RPC
# call, a redirect, a counter, the archive — and runs in both modes.
mode: full

# How long the suite's own pre-flight wait (waitForPromotedRollout,
# e2e/suite/readiness_test.go) gives EACH of the application release's
# Deployments to finish rolling out to THIS chart's version before any
# test runs — a Go duration (e.g. "3m"). Empty (the default) means the
# harness's own DefaultRolloutTimeout (2m), which is comfortably inside
# job.activeDeadlineSeconds below.
#
# A STRING, not an integer: rendered straight into E2E_ROLLOUT_TIMEOUT,
# which time.ParseDuration reads — the same shape Go's own flag and env
# conventions use everywhere else, so a platform that already writes "90s"
# or "3m" for a timeout elsewhere writes the same shape here.
rolloutTimeout: ""

# Where the release under test keeps its database, and under what names —
# read off url-shortener-infra's own render (or a platform's equivalent),
# never invented here. Two roles, because the migration and the services
# are trusted with different things — see charts/url-shortener/values.yaml
# for why there are two.
database:
  host: ""
  name: ""
  owner:
    role: ""
  app:
    role: ""
    # The Secret holding the runtime role's password, and the key inside
    # it. Read into the suite as an ENVIRONMENT VARIABLE via
    # `secretKeyRef` (templates/job.yaml) — which needs no RBAC grant at
    # all, because the value is resolved when this Pod is admitted, never
    # read back by its own ServiceAccount token. That is also why this
    # chart's Role names no Secret permission: see templates/rbac.yaml.
    passwordSecret: ""
    passwordKey: password

# The stream, its two subjects and the two durable consumer names — all
# five cluster-global on the broker (see
# charts/url-shortener/templates/_helpers.tpl's own comment on why they
# are a formula rather than a value on THAT chart) and read off
# url-shortener-infra's render here for the same reason database.* is.
events:
  stream: ""
  redirectSubject: ""
  requestSubject: ""
  statConsumer: ""
  logConsumer: ""

# Where the request archive is, on the same terms as
# charts/url-shortener/values.yaml's own archive.bucket: an endpoint, a
# region and a bucket name reach a cloud service, a store inside the
# cluster or a test double, and this chart cannot tell which it got.
# Empty endpoint means the SDK's own resolution — appropriate wherever the
# archive is reached under a workload identity; a local store needs it
# set (see examples/url-shortener/hack/install.sh's LOCAL_STORE_ARGS).
archive:
  bucket: ""
  region: ""
  endpoint: ""
  # STATIC credentials for the endpoint above, on exactly the same terms
  # as charts/url-shortener's own archive.bucket.credentialsSecret: a
  # Secret NAME, never a value, read into the suite as an environment
  # variable via `secretKeyRef` — no RBAC on Secrets, for the same reason
  # database.app.passwordSecret above needs none. Empty means the
  # suite's own default AWS credential chain, which is right wherever the
  # endpoint is reached under a workload identity and wrong for a local
  # store with no identity plane to hand it (e.g. this box's own S3
  # stand-in, which answers at a real endpoint but authenticates nothing
  # an ambient credential chain can discover).
  credentialsSecret: ""
  accessKeyIDKey: accessKeyID
  secretAccessKeyKey: secretAccessKey

# A Jaeger-API query endpoint. Optional: unset skips the one trace-shaped
# case (e2e/suite/trace_test.go) rather than fail it — nothing here can
# supply a trace store this environment was never given one of.
traces:
  url: ""

  # Optional, and goes together: a trace store that authenticates its
  # readers, on exactly the same terms as
  # charts/url-shortener/values.yaml's own `events.auth.audience` — a
  # PROJECTED ServiceAccount token this Job cannot forge, never a
  # credential these values hold. tokenURL empty (the default) means
  # traces.url — if even that is set — admits anonymous readers, and the
  # suite sends no Authorization header at all.
  tokenExchange:
    # The issuer's token endpoint (RFC 8693 token exchange). Verified
    # against the SUITE IMAGE's own default trust store — appropriate for
    # a public issuer; see examples/url-shortener/e2e/traceauth's package
    # doc comment for why this is never traces.caConfigMap below.
    tokenURL: ""
    # Both the RFC 8693 `audience` this exchange asks for and the HTTP
    # Basic auth username it authenticates the request with — see
    # traceauth.Config.Client's own doc comment for why nothing else
    # authenticates it.
    client: ""
    # The audience THIS JOB'S OWN projected token carries when it is
    # exchanged — the proof it presents, never the client it is asking to
    # become (that is `client` above). "access-issuer" is the
    # conventional audience an identity broker's own exchange endpoint
    # expects of every workload's subject token, whatever it is
    # exchanging for; a platform using a different broker can set this to
    # whatever ITS issuer expects instead.
    audience: access-issuer
    # Comfortably longer than trace_test.go's own polling bound (60s
    # total, including this exchange), short enough that a leaked log
    # line ages out on its own — the same value
    # charts/url-shortener/values.yaml's `events.auth.expirationSeconds`
    # defaults to.
    expirationSeconds: 3600

  # Optional CA bundle for traces.url ALONE, never for tokenExchange.tokenURL
  # above (see traceauth's own package doc comment for why the two are
  # never the same trust store) — a ConfigMap name, mounted read-only,
  # for a private trace store whose leaf the suite image's own trust
  # store does not sign. Empty means the suite image's own default trust
  # store, appropriate wherever the store is reachable the same way a
  # public issuer is.
  caConfigMap: ""
  # The key inside caConfigMap holding the PEM bundle. "ca-certificates.crt"
  # is the key a trust-manager Bundle target commonly writes; a platform
  # using a different ConfigMap shape sets this to match it.
  caConfigMapKey: ca-certificates.crt

# The e2e image, on exactly the same terms as
# charts/url-shortener/values.yaml's images map: ONE entry, stamped with a
# digest by the same `helmctl package --manifest` a release already runs
# for the other two charts in this pair — see .goreleaser.yaml's `e2e` kos
# entry and hack/example-snapshot.sh for the kind-box loop's own copy of
# that same step. Unstamped, the chart falls back to its own appVersion,
# same as every other chart here; a published chart always carries a
# digest.
images:
  e2e: {registry: ghcr.io, repository: truvity/policy/url-shortener/e2e, tag: "", digest: ""}
  # Read only when prober.enabled is true (templates/prober.yaml) — a chart
  # installed with the prober left off need not carry a digest for an image
  # it never runs.
  prober: {registry: ghcr.io, repository: truvity/policy/url-shortener/prober, tag: "", digest: ""}

pullPolicy: IfNotPresent

job:
  # UNSET by default, and left out here on purpose — see templates/job.yaml's
  # own comment and docs/guides/conformance.md: a GitOps controller applying
  # this chart with self-heal on sees a Job that deleted itself as MISSING
  # from the live state and recreates it, running this whole suite (its DDL
  # case included) again on a loop, forever, at a fixed version. Left unset,
  # the Job simply persists until the next version's apply prunes it, or
  # `helm uninstall`. Set this only where nothing applies this chart with
  # self-heal on; the schema still floors it at 120s — long enough for
  # somebody, or a monitoring read of the Job's status, to see it across at
  # least two scrapes before it disappears.
  # ttlSecondsAfterFinished: 600
  # Small: a suite that fails is a real failure to look at, not a fluke to
  # retry into passing.
  backoffLimit: 0
  # Bounds how long this Job — and therefore whatever is waiting on it,
  # `helm upgrade --wait` or a GitOps controller's own health check — can
  # run before Kubernetes kills it.
  activeDeadlineSeconds: 300

  # Rendered on the JOB'S OWN metadata, never the pod template's — for a
  # GitOps controller that must replace, not patch, an immutable Job when
  # this chart's values change at the same version, e.g. a force/replace
  # sync option some controllers key off an annotation to select which
  # objects they are allowed to delete-and-recreate rather than apply in
  # place. `url-shortener-e2e.jobName`'s own comment already sidesteps the
  # immutability problem across VERSIONS by folding the version into the
  # name; this is for the narrower case where a platform changes only the
  # VALUES this chart renders (e.g. turning on traces.tokenExchange) at a
  # version already deployed, which the name alone does not cover. Empty
  # by default: nothing here decides what a controller's own annotation is
  # called or what it does, only that this chart lets a platform set it.
  annotations: {}

  # Whether the SUITE presents a workload identity to the application
  # release — the Job's counterpart of what the prober's `tls` block already
  # does for the prober, and off by default on the same terms: byte-identical
  # to a chart that had never heard of it.
  #
  # It reads the top-level `tls` block below (mode, components, trustDomain,
  # csiDriver, mountPath, grantRequest, port, peers) — ONE description of the
  # application release, shared with the prober — and adds only this switch,
  # because turning the transport on for a platform already running the
  # prober must not silently change what the Job asks of the application
  # release's allow-lists.
  #
  # The identity is requested AS the Job's own account (`serviceAccount`
  # below, `<release>-e2e` by default), a SEPARATE account from the prober's,
  # so its name is one more entry to grant: add it to the application chart's
  # `tls.peers.urls` (and `tls.peers.redirect`, wherever `redirect` is not
  # `off`) BEFORE making `urls` strict. Otherwise the suite is refused at the
  # handshake, and the error names a certificate rather than a list nobody
  # filled in.
  tls:
    enabled: false

resources:
  requests: { cpu: 50m, memory: 64Mi }

# The account this Job runs as. Named, never generated — a platform that
# needs to grant it something (beyond what templates/rbac.yaml already scopes
# it to: with `job.tls.enabled`, the application chart's `tls.peers` must
# name it) can bind a name it chose.
serviceAccount:
  create: true
  name: ""

# Who the process is, inside the pod — the same defaults every other
# workload in this pair of charts uses (charts/url-shortener/values.yaml's
# podSecurity), so a platform that already trusts those trusts this too.
podSecurity:
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

# Always-on synthetic traffic (docs/guides/testing.md): the SAME journeys
# examples/url-shortener/e2e/suite proves once, walked in a loop against
# THIS release's own `urls` and `redirect` Services, so a bake window (a
# Kargo gate, or a person watching a rollout) has signal to read even when
# nothing real is happening yet.
#
# Off by default and a Deployment of its own, not the e2e Job above: it is
# a SEPARATE workload making a SEPARATE claim — the Job proves a release IS
# healthy, once, and exits; this proves a release STAYS healthy, for as
# long as it keeps running — and a chart installable by someone with no
# bake window to feed it must not run one uninvited.
#
# The probes listener has no value of its own here: it is ":7070", the
# fixed convention every workload in this pair of charts answers on
# (service.md §3) — see templates/prober.yaml.
prober:
  enabled: false

  # How often one full pass (create, resolve, watch the counter move)
  # repeats, as a Go duration.
  interval: 10s

  # Marks every long URL and key this prober invents, the same role
  # examples/url-shortener/e2e/suite's own testDataPrefix plays for the
  # suite: a person reading the urls table or the archive bucket by hand
  # can tell synthetic traffic from a real caller's at a glance.
  keyPrefix: "probe-"

  # How long the "stat" journey keeps watching a link's click count after it
  # first reads exactly 1, and fails if it moves again. A click that the
  # counter fails to acknowledge is redelivered after the consumer's ack
  # wait (30s), and counted again: it reads 1 at the first look and 2 half a
  # minute later. The hold has to outlast a redelivery, so it defaults to
  # twice the ack wait. One pass therefore takes about this long plus the
  # time the count takes to arrive, and passes run back to back, so `interval`
  # is the pause between them, not the period. "0s" turns the hold off.
  statSettle: 60s

  pullPolicy: IfNotPresent

  resources:
    requests: { cpu: 10m, memory: 32Mi }

  log:
    level: info

  # How long the loop is given to finish its current pass after SIGTERM —
  # service.md §5. There is little to drain: one pass is at most a few HTTP
  # calls, so the default is small.
  drain:
    seconds: 5

  podSecurity:
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

  # The account the prober's OWN Deployment runs as — a SEPARATE account
  # from the e2e Job's own `serviceAccount` above, because the two carry
  # different grants: the Job's account is what the Kubernetes API RBAC in
  # templates/rbac.yaml binds to, and this one is what a CSI-mounted
  # identity (see the top-level `tls` block below) — and, once a platform
  # grants it, the application release's own `tls.peers` — names. Rendered
  # only while `tls.mode` is not `off` (templates/prober-identity-rbac.yaml):
  # a prober installed with the transport left off keeps running as the
  # namespace's own default account, exactly as it does today. Empty means
  # the release's own, suffixed.
  serviceAccount:
    create: true
    name: ""

# Workload identity for the prober's OWN calls to `urls` and `redirect` —
# the same fragment (schemas/fragments/tls.json) and the same fields
# charts/url-shortener uses for a client-only component (`stat`, `web`):
# a caller either presents an identity or it does not, so there is no
# authenticated PORT to add here, only the switch and the certificate.
#
# `off` is the default, on exactly the same terms as charts/url-shortener's
# own default: a chart installable against a platform that provides none of
# this must render byte-identical to one that has never heard of it. That is
# also what lets the application chart's `urls` component move from `off` to
# `permissive` to `strict` a step at a time: this chart's own `tls.mode`
# has to be turned on to match, or `strict` finds a prober still calling
# cleartext, and the failure this exists to prevent is exactly the one it
# is named for.
#
# THIS CHART CANNOT READ THE APPLICATION RELEASE'S OWN `tls.mode` OR
# `tls.port` — it is a separate Helm release (see this file's own opening
# comment on why every name below is a value, never a formula, for exactly
# this reason) — so a platform enabling transport identity sets BOTH
# charts' values to agree, the same way it already keeps `database.host`
# and the `events.*` names above in step with url-shortener-infra's actual
# render. Mismatched, the prober dials a port the application is not
# serving TLS on, which fails as a connection refusal, not as anything
# that names a setting.
#
# The prober reads this whenever it is not `off`; the e2e Job reads it only
# when `job.tls.enabled` says so (see `job` above), and then mirrors the
# prober: the Job's account is what the identity is requested as, and it is
# another entry in the application chart's `tls.peers.urls` /
# `tls.peers.redirect`, exactly as the prober's is.
tls:
  # off | permissive | strict — the SAME enum charts/url-shortener's own
  # tls.mode uses, so a platform sets one value it already understands
  # rather than learning a second vocabulary for the same switch.
  #
  # The prober SERVES nothing under any of these: its only listener is the
  # cleartext probes one every component here carries. So the rendered
  # prober configuration (templates/prober-config.yaml) always asks the
  # transport package for `strict` once this is not `off` — the same rule
  # charts/url-shortener/templates/config.yaml states for `stat` and `web`,
  # and for the same reason: a client either presents an identity or it
  # does not, and `permissive` is meaningless with no second listener to
  # put anywhere.
  #
  # What THIS value still decides is which of `urls` and `redirect`'s own
  # ports the prober dials: the ordinary one, over TLS, once the
  # application release is `strict`; or the alternate one named by `port`
  # below, once it is `permissive` and the ordinary port is still
  # cleartext. See templates/prober-config.yaml's own comment.
  mode: "off"

  # Per-target override of `mode`: the mode the application release runs
  # `urls` and `redirect` in, which decides which port and scheme each is
  # dialled on. Same meaning as charts/url-shortener's own `tls.components`;
  # unset means `mode`, so a chart that never heard of this renders as
  # before. It exists because the application chart no longer runs the two
  # alike: `urls` may be `strict` while `redirect`, fronted by a gateway,
  # stays `permissive`.
  #
  #   tls:
  #     mode: permissive
  #     components:
  #       urls:
  #         mode: strict
  #
  # `redirect` can never be `strict` — the application chart refuses it — so
  # it is refused here too, written down or inherited from a release-wide
  # `mode: strict`. Naming only `urls` is the way to say "the URL service is
  # strict".
  components: {}

  # The root of every identity this prober will accept an ANSWER from when
  # it calls `urls` and `redirect` — see `peers` below for why that is a
  # different question from who may call the prober, which is nobody: it
  # serves no port beyond its own liveness and readiness probes.
  trustDomain: ""

  # What mounts the identity, and where. The platform owns the first; the
  # chart only has to agree with it. Same defaults as charts/url-shortener.
  csiDriver: spiffe.csi.cert-manager.io
  mountPath: /var/run/identity

  # The identity is requested AS the prober's own account — that is what
  # makes it attested rather than claimed — so that account needs
  # permission to ask. Set false where the platform grants this centrally.
  # Same default as charts/url-shortener's own tls.grantRequest.
  grantRequest: true

  # The authenticated port `urls` and `redirect` serve BESIDE their
  # cleartext one while the application release is `permissive` — same
  # meaning, same default, as charts/url-shortener's own tls.port. Unused
  # under `off` or `strict`: under `strict` the ordinary port is simply
  # that release's own job, so nothing here has to name a second one.
  port: 8443

  # Who this prober will ACCEPT AN ANSWER FROM — an ACCOUNT, never an
  # address, on the same terms as charts/url-shortener's own tls.peers:
  # an address resolves to whoever holds it today. Empty admits no answer
  # at all, which is the correct default for a caller nobody has told to
  # trust anything yet.
  #
  # This is NOT granted by the application chart the way it grants its own
  # internal callers (charts/url-shortener/templates/config.yaml's own
  # comment on why `urls.yaml` renders its counter's account before any
  # operator-supplied peer): that rule is for a chart wiring components IT
  # renders. This chart renders neither `urls` nor `redirect` — it is a
  # SEPARATE Helm release calling somebody else's — so it has no account of
  # theirs to grant itself here, and the application chart has no account
  # of the PROBER's to grant either. Once this chart's `tls.mode` is not
  # `off`, a platform must add the prober's own ServiceAccount name (see
  # templates/_helpers.tpl's "url-shortener-e2e.proberServiceAccountName",
  # or the exact name given at prober.serviceAccount.name) to the
  # application chart's OWN `tls.peers.urls` and `tls.peers.redirect` —
  # otherwise `strict` refuses the prober at the handshake, and the error
  # names a certificate rather than a list nobody filled in.
  peers: []

# Telemetry for the prober, on exactly the same terms as
# charts/url-shortener/values.yaml's own `otel` block — see that chart's
# `_helpers.tpl`'s "url-shortener.telemetryEnv" for the whole rule (decision
# 0006). Nothing else in this chart is instrumented: the e2e Job is a
# one-shot test run that reports its result as a Job condition and a log,
# not a workload a bake window watches over time.
otel:
  endpoint: ""
  protocol: http/protobuf
  tracesSampler: parentbased_traceidratio
  sampleRatio: "0.1"
  resourceAttributes: {}
