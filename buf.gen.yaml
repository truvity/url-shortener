# What is generated, and where it lands.
#
# Generated code is COMMITTED, and `just drift` fails on a diff — the same
# rule the shared schemas follow. The alternative is a build step between a
# checkout and a compiler, which is a step that has to work on every machine
# forever, and the first thing it breaks is the editor.
version: v2
clean: true
managed:
  enabled: false
plugins:
  # The messages.
  - local: protoc-gen-go
    out: internal/gen
    opt: paths=source_relative
  # The client and the server. ONE handler serves Connect, gRPC and gRPC-Web,
  # which is why there is no second plugin here for the other two.
  - local: protoc-gen-connect-go
    out: internal/gen
    opt: paths=source_relative
  # TypeScript. ONE plugin, not two: connect-es v2 builds a client from the
  # service descriptor this emits, so the separate connect plugin the v1
  # line needed is gone. Generated into the front end's source tree, and
  # committed, for the same reason the Go code is — a build step between a
  # checkout and a compiler breaks the editor first.
  - local: protoc-gen-es
    out: web/src/gen
    opt:
      - target=ts
      # `.ts`, not `.js`. The front end's server runs TypeScript directly —
      # Node strips the types and resolves the path it is GIVEN — so an
      # import ending in `.js` points at a file that was never emitted. The
      # bundler is happy either way; the runtime is not.
      - import_extension=ts
inputs:
  - directory: proto
