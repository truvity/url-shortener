# Yarn 4. The cache is not committed: this package has three runtime
# dependencies, and a committed cache in a public repository is megabytes of
# other people's code in every clone.
nodeLinker: node-modules
enableGlobalCache: true

# The package is not published (private: true in package.json); the web front
# end consumes it through a `portal:` link, so no registry credential lives here.
