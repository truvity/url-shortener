# Yarn 4. The cache is not committed: this package has three runtime
# dependencies, and a committed cache in a public repository is megabytes of
# other people's code in every clone.
nodeLinker: node-modules
enableGlobalCache: true

# Publishing to GitHub Packages needs a token even though the package is
# public. It is INTERPOLATED from the environment rather than written here:
# a token in a file is a token in a diff, and `yarn config set` would put it
# in this one during a release.
#
# Keyed by REGISTRY rather than by scope, deliberately. A `npmScopes.truvity`
# entry is sent with every request for a package in that scope — including
# installs from the public registry, which would leak the token to whoever
# resolves next. This entry applies only when something is actually talking
# to GitHub Packages, which is only ever the publish.
npmRegistries:
  "https://npm.pkg.github.com":
    npmAlwaysAuth: true
    npmAuthToken: "${GITHUB_PACKAGES_TOKEN:-}"
