# Known vulnerabilities in what this repository depends on: the `vuln` recipe,
# through the same shared workflow that runs every other recipe. Deliberately
# NOT in ci.yaml's recipe list and not a required context: a new advisory is
# news about the world, not about the change under review. Hosted runners, a
# read-only token, no secret.
name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@92b77363d8fb3a422562287a71107c122dc9637a # v5.12.0
    with:
      recipes: '["vuln"]'
